name: Windows packaged installation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published release tag to install (blank packages this checkout)"
        required: false
        type: string

# A new push to a branch cancels the older run on that branch (pull requests only; every push to main and every nightly run has its own group, so none is dropped).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A docs-only pull request does not change what this workflow builds or
  # installs, so the heavy jobs below skip it. The skip has to happen INSIDE
  # the workflow: a `paths-ignore` filter on the trigger stops the workflow from
  # running at all, so its two required checks ("Package the exact source
  # candidate" and "Fresh Windows Setup.exe install") never
  # report and a docs-only pull request can never reach a mergeable state. A job
  # skipped by `if:` reports as skipped, which satisfies a required check.
  # Failure is safe: if this job cannot classify the change, `docs_only` is not
  # "true" and both heavy jobs run. That depends on the status function in each
  # heavy job's `if:` (`!cancelled()` / `always()`): GitHub SKIPS a job whose
  # dependency failed unless its condition has one, and a skipped required job
  # reports success, so without it a failed classifier would let a non-doc PR
  # satisfy both required checks without running them. Do not remove it.
  # push to main and workflow_dispatch always classify as not-docs-only.
  changes:
    name: Classify the change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Is every changed file documentation?
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          docs_only=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            files="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
            # Documentation = anything under docs/ and any *.md file, the same two
            # patterns the old trigger filter used.
            if [ -n "$files" ] && ! echo "$files" | grep -v -E '^docs/|\.md$' | grep -q .; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

  package:
    needs: changes
    if: ${{ !cancelled() && !inputs.release_tag && needs.changes.outputs.docs_only != 'true' }}
    name: Package the exact source candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source-sha: ${{ steps.identity.outputs.source-sha }}
      archive-sha256: ${{ steps.identity.outputs.archive-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Create the downloadable source package
        run: node scripts/package-windows.mjs "$RUNNER_TEMP/windows-package"
      - name: Bind the archive to this checkout
        id: identity
        shell: bash
        run: |
          echo "source-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node --input-type=module -e 'import {readdirSync,readFileSync,appendFileSync} from "node:fs"; import {join} from "node:path"; import {createHash} from "node:crypto"; const dir=join(process.env.RUNNER_TEMP,"windows-package"); const names=readdirSync(dir).filter(n=>n.endsWith(".zip")); if(names.length!==1) throw Error("Expected one release ZIP"); appendFileSync(process.env.GITHUB_OUTPUT,"archive-sha256="+createHash("sha256").update(readFileSync(join(dir,names[0]))).digest("hex")+"\n");'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-source-package
          path: ${{ runner.temp }}/windows-package/*
          if-no-files-found: error

  setup:
    name: Build the self-contained Windows Setup.exe
    needs: changes
    if: ${{ !cancelled() && !inputs.release_tag && needs.changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      source-sha: ${{ steps.identity.outputs.source-sha }}
      setup-sha256: ${{ steps.identity.outputs.setup-sha256 }}
    env:
      WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Install checksum-verified pinned Inno Setup (CI only)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.4.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe' -OutFile $installer
          ./scripts/verify-inno-setup.ps1 -InstallerPath $installer
          $innoDirectory = Join-Path $env:RUNNER_TEMP 'Inno Setup 6.4.3'
          $installLog = Join-Path $env:RUNNER_TEMP 'inno-install.log'
          $install = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /CURRENTUSER /PORTABLE=1 /DIR=`"$innoDirectory`" /LOG=`"$installLog`"" -WindowStyle Hidden -PassThru -Wait
          Get-Content -LiteralPath $installLog
          if ($install.ExitCode -ne 0) { throw "Pinned Inno Setup installation failed: $($install.ExitCode)." }
          "INNO_ISCC_PATH=$(Join-Path $innoDirectory 'ISCC.exe')" >> $env:GITHUB_ENV
      - name: Prove installer download and runtime gates reject broken payloads
        shell: pwsh
        run: ./scripts/windows-setup-checks.test.ps1 -IsccPath $env:INNO_ISCC_PATH
      - name: Build the offline Windows installer and report part sizes
        shell: pwsh
        run: ./scripts/build-windows-setup.ps1 -OutputDirectory "$env:RUNNER_TEMP\windows-setup" -IsccPath $env:INNO_ISCC_PATH
      # OPTIONAL SIGNING: unsigned by default. No certificate is supplied by this repo.
      - name: Optional signtool signing with the owner's certificate
        if: ${{ env.WINDOWS_SIGNING_PFX != '' }}
        shell: pwsh
        env:
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'townreporter-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX))
            $tool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
            if (!$tool) { throw 'signtool is unavailable.' }
            $exe = @(Get-ChildItem "$env:RUNNER_TEMP\windows-setup" -Filter '*-Setup.exe' -File)
            if ($exe.Count -ne 1) { throw 'Expected one Setup.exe to sign.' }
            $arguments = @('sign', '/f', $pfx, '/fd', 'SHA256', '/tr', 'http://timestamp.digicert.com', '/td', 'SHA256')
            if ($env:WINDOWS_SIGNING_PASSWORD) { $arguments += @('/p', $env:WINDOWS_SIGNING_PASSWORD) }
            & $tool.FullName @arguments $exe[0].FullName
            if ($LASTEXITCODE -ne 0) { throw 'Optional signing failed.' }
            & $tool.FullName verify /pa $exe[0].FullName
            if ($LASTEXITCODE -ne 0) { throw 'Signature verification failed.' }
          } finally { if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx } }
      - name: Bind the final (possibly signed) installer to this checkout
        id: identity
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem "$env:RUNNER_TEMP\windows-setup" -Filter '*-Setup.exe' -File)
          if ($exe.Count -ne 1) { throw 'Expected one Setup.exe.' }
          $hash = (Get-FileHash -LiteralPath $exe[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $metadata = Get-Content -LiteralPath "$($exe[0].FullName).json" -Raw | ConvertFrom-Json
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $metadata.commit -cne $commit) { throw 'Setup source identity mismatch.' }
          $metadata.sha256 = $hash
          $metadata.bytes = $exe[0].Length
          $metadata | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath "$($exe[0].FullName).json"
          "$hash *$($exe[0].Name)" | Set-Content -LiteralPath "$($exe[0].FullName).sha256" -Encoding ASCII
          "source-sha=$commit" >> $env:GITHUB_OUTPUT
          "setup-sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "Final Setup.exe: $($exe[0].Length) bytes; SHA256 $hash"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-setup
          path: ${{ runner.temp }}/windows-setup/TownReporter-*-Setup.exe*
          if-no-files-found: error

  install:
    name: Fresh Windows Setup.exe install
    needs: [changes, package, setup]
    if: ${{ always() && needs.changes.outputs.docs_only != 'true' && (needs.setup.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
    runs-on: windows-latest
    # 55 minutes covered the offline install and acceptance walk; the
    # one-installation proof adds a refused Setup run and an in-place upgrade.
    timeout-minutes: 75
    env:
      INSTALL_SOURCE_COMMIT: ${{ needs.setup.outputs.source-sha }}
      INSTALL_SOURCE_SHA256: ${{ needs.setup.outputs.setup-sha256 }}
    steps:
      # Test drivers stay outside the installed payload. No setup-node or npm;
      # every runtime check uses the bundled node.exe and Chromium.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_tag || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          path: ci-source
      - name: Start the measured installation clock
        shell: pwsh
        run: |
          "INSTALL_ACCEPTANCE_STARTED_AT=$([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_ENV
          "INSTALL_EVIDENCE_DIR=$env:RUNNER_TEMP\install-evidence" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\install-evidence" | Out-Null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !inputs.release_tag }}
        with:
          name: windows-setup
          path: ${{ runner.temp }}/downloaded-package
      - name: Download and verify the published release assets
        if: ${{ inputs.release_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Read-GitHubJson([string]$endpoint) {
            $json = & gh api $endpoint
            if ($LASTEXITCODE -ne 0) { throw "GitHub request failed: $endpoint" }
            return ($json | ConvertFrom-Json)
          }
          $tag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $release = Read-GitHubJson "repos/$env:RELEASE_REPOSITORY/releases/tags/$tag"
          if ($release.draft -or $release.tag_name -cne $env:RELEASE_TAG) { throw 'Expected the requested published release.' }
          $ref = Read-GitHubJson "repos/$env:RELEASE_REPOSITORY/git/ref/tags/$tag"
          $target = $ref.object
          # Peel annotated tags, including tags pointing to other annotated tags.
          for ($depth = 0; $target.type -eq 'tag' -and $depth -lt 16; $depth++) {
            $annotated = Read-GitHubJson "repos/$env:RELEASE_REPOSITORY/git/tags/$($target.sha)"
            $target = $annotated.object
          }
          if ($target.type -ne 'commit' -or $target.sha -cnotmatch '^[a-f0-9]{40}$') { throw 'Release tag did not resolve to a commit.' }
          $archives = @($release.assets | Where-Object { $_.name -cmatch '^TownReporter-[0-9][A-Za-z0-9.+-]*-Setup\.exe$' })
          if ($archives.Count -ne 1) { throw 'Expected exactly one published Windows Setup.exe.' }
          $name = $archives[0].name
          $destination = "$env:RUNNER_TEMP\downloaded-package"
          New-Item -ItemType Directory -Path $destination | Out-Null
          foreach ($assetName in @($name, "$name.json", "$name.sha256")) {
            if (@($release.assets | Where-Object { $_.name -ceq $assetName }).Count -ne 1) { throw "Missing or duplicate release asset: $assetName" }
            & gh release download $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --pattern $assetName --dir $destination
            if ($LASTEXITCODE -ne 0) { throw "Release asset download failed: $assetName" }
          }
          $metadata = Get-Content -LiteralPath (Join-Path $destination "$name.json") -Raw | ConvertFrom-Json
          $hash = (Get-FileHash -LiteralPath (Join-Path $destination $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = (Get-Content -LiteralPath (Join-Path $destination "$name.sha256") -Raw).Trim()
          if ($metadata.filename -cne $name -or $metadata.commit -cne $target.sha -or $metadata.sha256 -cne $hash) { throw 'Release Setup.exe metadata does not match the downloaded artifact and tag commit.' }
          if ($checksum -cnotmatch ('^' + $hash + '\s+\*?' + [regex]::Escape($name) + '$')) { throw 'Published checksum sidecar does not match Setup.exe.' }
          "INSTALL_SOURCE_COMMIT=$($target.sha)" >> $env:GITHUB_ENV
          "INSTALL_SOURCE_SHA256=$hash" >> $env:GITHUB_ENV
          @{ releaseTag=$release.tag_name; releaseUrl=$release.html_url; sourceCommit=$target.sha; archiveSha256=$hash; assetId=$archives[0].id; assetName=$name } | ConvertTo-Json | Set-Content -LiteralPath "$env:INSTALL_EVIDENCE_DIR\published-release.json"
      - name: Verify the downloaded installer and prepare the long data path
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem "$env:RUNNER_TEMP\downloaded-package" -Filter '*-Setup.exe' -File)
          if ($exes.Count -ne 1) { throw 'Expected exactly one Setup.exe.' }
          $hash = (Get-FileHash -LiteralPath $exes[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $metadata = Get-Content -LiteralPath "$($exes[0].FullName).json" -Raw | ConvertFrom-Json
          $checksum = (Get-Content -LiteralPath "$($exes[0].FullName).sha256" -Raw).Trim()
          if ($hash -cne $env:INSTALL_SOURCE_SHA256 -or $metadata.sha256 -cne $hash -or $metadata.commit -cne $env:INSTALL_SOURCE_COMMIT -or $metadata.filename -cne $exes[0].Name) { throw 'Downloaded Setup.exe identity mismatch.' }
          if ($checksum -cnotmatch ('^' + $hash + '\s+\*?' + [regex]::Escape($exes[0].Name) + '$')) { throw 'Setup checksum sidecar mismatch.' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'installed TownReporter'
          "INSTALL_ROOT=$installRoot" >> $env:GITHUB_ENV
          "INSTALL_APP_ROOT=$installRoot\app" >> $env:GITHUB_ENV
          "INSTALL_SOURCE_ARCHIVE=$($exes[0].FullName)" >> $env:GITHUB_ENV
          $dataRoot = Join-Path $env:LOCALAPPDATA ('TownReporter\ci-long-path-' + ('p' * 110) + '-' + [guid]::NewGuid().ToString('N').Substring(0,8))
          if ($dataRoot.Length -lt 140) { throw 'Long-path fixture must be at least 140 characters.' }
          "INSTALL_DATA_ROOT=$dataRoot" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path $dataRoot -Force | Out-Null
          @{ TOWNREPORTER_CLAUDE_CODE='0'; TOWNREPORTER_CODEX='0'; TOWNREPORTER_LOCAL='0' } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $dataRoot 'providers.json')
      - name: Install Setup.exe silently with outbound networking blocked
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ruleName = 'TownReporter offline install ' + [guid]::NewGuid().ToString('N')
          $installer = $null
          $started = [DateTime]::UtcNow
          $probeFailed = $false
          $installed = $false
          # Establish that the same request can reach the internet before blocking it.
          Invoke-WebRequest -Uri 'https://example.com' -DisableKeepAlive -TimeoutSec 20 | Out-Null
          try {
            # Block Setup, every shipped executable, and both PowerShell hosts.
            # Preserve loopback and GitHub runner heartbeats/artifact transport.
            $metadata = Get-Content -LiteralPath "$env:INSTALL_SOURCE_ARCHIVE.json" -Raw | ConvertFrom-Json
            if (!$metadata.executables -or $metadata.executables -notcontains 'node\node.exe' -or $metadata.executables -notcontains 'pgsql\bin\postgres.exe') { throw 'Setup executable inventory is incomplete.' }
            $programs = @($env:INSTALL_SOURCE_ARCHIVE, (Get-Process -Id $PID).Path, "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe")
            foreach ($relative in $metadata.executables) {
              $program = [IO.Path]::GetFullPath((Join-Path $env:INSTALL_ROOT $relative))
              if (!$program.StartsWith($env:INSTALL_ROOT.TrimEnd('\') + '\', [StringComparison]::OrdinalIgnoreCase)) { throw 'Executable inventory escapes the installation folder.' }
              $programs += $program
            }
            foreach ($program in @($programs | Sort-Object -Unique)) {
              New-NetFirewallRule -DisplayName $ruleName -Direction Outbound -Action Block -Profile Any -Program $program -RemoteAddress @('0.0.0.0-126.255.255.255','128.0.0.0-255.255.255.255','::2-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff') | Out-Null
            }
            "INSTALL_FIREWALL_RULE=$ruleName" >> $env:GITHUB_ENV
            try { Invoke-WebRequest -Uri 'https://example.com' -DisableKeepAlive -TimeoutSec 10 | Out-Null }
            catch { $probeFailed = $true }
            if (!$probeFailed) { throw 'Outbound request unexpectedly succeeded; offline proof is invalid.' }
            $startInfo = [Diagnostics.ProcessStartInfo]::new($env:INSTALL_SOURCE_ARCHIVE)
            $startInfo.UseShellExecute = $true
            $startInfo.WindowStyle = [Diagnostics.ProcessWindowStyle]::Hidden
            $startInfo.Arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="' + $env:INSTALL_ROOT + '" /DATAROOT="' + $env:INSTALL_DATA_ROOT + '" /LOG="' + $env:INSTALL_EVIDENCE_DIR + '\setup.log"'
            $installer = [Diagnostics.Process]::Start($startInfo)
            $null = $installer.Handle
            if (!$installer.WaitForExit(1500000)) { throw 'Setup.exe exceeded its 25-minute deadline.' }
            $installer.Refresh()
            if ($null -eq $installer.ExitCode -or $installer.ExitCode -ne 0) { throw "Setup.exe failed: $($installer.ExitCode)." }
            # Resolve the shipped Chromium offline; no workstation browser cache.
            $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:INSTALL_ROOT 'chromium'
            Push-Location -LiteralPath $env:INSTALL_APP_ROOT
            try {
              & "$env:INSTALL_ROOT\node\node.exe" --input-type=module -e 'import {chromium} from "playwright"; const browser=await chromium.launch(); const page=await browser.newPage(); await page.goto("http://127.0.0.1:4388/"); if(!(await page.title())) throw Error("Paper has no title"); await browser.close();'
              if ($LASTEXITCODE -ne 0) { throw 'Bundled Chromium offline launch failed.' }
            } finally { Pop-Location }
            $installed = $true
          } finally {
            if ($installer -and !$installer.HasExited) { $installer.Kill($true); [void]$installer.WaitForExit(10000) }
            @{ outboundProbeFailed=$probeFailed; installed=$installed; elapsedSeconds=([DateTime]::UtcNow-$started).TotalSeconds; dataRootLength=$env:INSTALL_DATA_ROOT.Length; sourceCommit=$env:INSTALL_SOURCE_COMMIT; setupSha256=$env:INSTALL_SOURCE_SHA256 } | ConvertTo-Json | Set-Content -LiteralPath "$env:INSTALL_EVIDENCE_DIR\offline-install.json"
            if ($installer) { $installer.Dispose() }
            if (!$installed) { Get-NetFirewallRule -DisplayName $ruleName -ErrorAction SilentlyContinue | Remove-NetFirewallRule }
          }
      - name: Verify browser workflow, stale-build refusal and restart persistence
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath "$env:INSTALL_DATA_ROOT\config.json" -Raw | ConvertFrom-Json
          & $config.NodeExe "$env:GITHUB_WORKSPACE\ci-source\scripts\windows-install-smoke.mjs" *> "$env:INSTALL_EVIDENCE_DIR\smoke.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:INSTALL_EVIDENCE_DIR\smoke.log"; throw 'Packaged installation acceptance failed.' }
          Get-Content "$env:INSTALL_EVIDENCE_DIR\receipt.json"
      - name: Gate native ownership, credential ACL, lifecycle and Windows operations
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath "$env:INSTALL_DATA_ROOT\config.json" -Raw | ConvertFrom-Json
          $env:DATABASE_URL = ''
          # Source-only ESM test drivers resolve the shipped production packages.
          New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\ci-source\node_modules" -Value "$env:INSTALL_APP_ROOT\node_modules" | Out-Null
          Push-Location -LiteralPath "$env:GITHUB_WORKSPACE\ci-source"
          try {
            & $config.NodeExe --test scripts/windows-installer.test.mjs *> "$env:INSTALL_EVIDENCE_DIR\native-contracts.log"
            if ($LASTEXITCODE -ne 0) { Get-Content "$env:INSTALL_EVIDENCE_DIR\native-contracts.log"; throw 'Native installation contracts failed.' }
            Get-Content "$env:INSTALL_EVIDENCE_DIR\native-contracts.log"
            & $config.NodeExe --test scripts/ops-scripts.test.mjs *> "$env:INSTALL_EVIDENCE_DIR\ops-contracts.log"
            if ($LASTEXITCODE -ne 0) { Get-Content "$env:INSTALL_EVIDENCE_DIR\ops-contracts.log"; throw 'Windows operational-script contracts failed.' }
            Get-Content "$env:INSTALL_EVIDENCE_DIR\ops-contracts.log"
          } finally { Pop-Location }
      - name: Stop the owned installation and record elapsed time
        if: always()
        shell: pwsh
        run: |
          $elapsed = ([DateTime]::UtcNow - [DateTime]::Parse($env:INSTALL_ACCEPTANCE_STARTED_AT).ToUniversalTime()).TotalSeconds
          @{ elapsedSeconds=$elapsed; maximumSeconds=3600; sourceCommit=$env:INSTALL_SOURCE_COMMIT; archiveSha256=$env:INSTALL_SOURCE_SHA256 } | ConvertTo-Json | Set-Content -LiteralPath "$env:INSTALL_EVIDENCE_DIR\elapsed.json"
          if ($env:INSTALL_APP_ROOT -and (Test-Path -LiteralPath "$env:INSTALL_DATA_ROOT\config.json")) {
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:INSTALL_APP_ROOT\installer\Stop.ps1" -DataRoot $env:INSTALL_DATA_ROOT
            if ($LASTEXITCODE -ne 0) { throw 'Owned installation cleanup failed.' }
          }
          if ($elapsed -ge 3600) { throw 'Installation acceptance exceeded one hour.' }
      # One TownReporter per Windows user. The install above registered itself in
      # the uninstall key Inno writes for this AppId, so a second Setup.exe run
      # must refuse a different folder, and a re-run into the recorded folder must
      # upgrade in place and leave the private newsroom data alone. The app is
      # stopped by the step above. This runs after the measured acceptance window.
      - name: Prove one installation only, so a second folder is refused and the recorded folder upgrades
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = $env:INSTALL_SOURCE_ARCHIVE
          $dataRoot = $env:INSTALL_DATA_ROOT
          $appRoot = $env:INSTALL_APP_ROOT
          $evidence = $env:INSTALL_EVIDENCE_DIR
          $config = Get-Content -LiteralPath "$dataRoot\config.json" -Raw | ConvertFrom-Json

          function Invoke-InstallerScript([string]$Name, [switch]$NoBrowser) {
            $arguments = @('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',"$appRoot\installer\$Name.ps1",'-DataRoot',$dataRoot)
            if ($NoBrowser) { $arguments += '-NoBrowser' }
            & powershell.exe @arguments
            if ($LASTEXITCODE -ne 0) { throw "$Name.ps1 failed while proving the one-installation rule." }
          }
          function Get-ArticleCount {
            $env:PGPASSWORD = $config.DatabasePassword
            try { $raw = & "$($config.PgBin)\psql.exe" -h 127.0.0.1 -p $config.PgPort -U townreporter -d townreporter -At -c 'select count(*) from articles;' }
            finally { $env:PGPASSWORD = $null }
            if ($LASTEXITCODE -ne 0) { throw 'psql could not read the articles table.' }
            $text = ($raw | Out-String).Trim()
            if ($text -notmatch '^\d+$') { throw "Unexpected article-count output: $text" }
            return [int]$text
          }
          function Wait-Paper([string]$Path) {
            $url = "http://127.0.0.1:$($config.Port)$Path"
            for ($attempt = 1; $attempt -le 60; $attempt++) {
              try { if ((Invoke-WebRequest -Uri $url -TimeoutSec 5).StatusCode -eq 200) { return } } catch { Start-Sleep -Seconds 2 }
            }
            throw "The paper did not answer at $url."
          }
          function Invoke-Setup([string]$Directory, [string]$LogName) {
            $startInfo = [Diagnostics.ProcessStartInfo]::new($setup)
            $startInfo.UseShellExecute = $true
            $startInfo.WindowStyle = [Diagnostics.ProcessWindowStyle]::Hidden
            $startInfo.Arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="' + $Directory + '" /DATAROOT="' + $dataRoot + '" /LOG="' + (Join-Path $evidence $LogName) + '"'
            $process = [Diagnostics.Process]::Start($startInfo)
            try {
              $null = $process.Handle
              if (!$process.WaitForExit(1500000)) { throw 'Setup.exe exceeded its 25-minute deadline.' }
              $process.Refresh()
              if ($null -eq $process.ExitCode) { throw 'Setup.exe reported no exit code.' }
              return $process.ExitCode
            } finally { $process.Dispose() }
          }

          $configSha = (Get-FileHash -LiteralPath "$dataRoot\config.json" -Algorithm SHA256).Hash
          $instanceId = $config.InstanceId
          try {
            # Baseline: the pre-upgrade build still serves the article the
            # acceptance run published into the private database.
            Invoke-InstallerScript 'Start' -NoBrowser
            $before = Get-ArticleCount
            if ($before -lt 1) { throw 'The acceptance installation has no article to preserve.' }
            Wait-Paper '/'
            Invoke-InstallerScript 'Stop'

            # A second Setup.exe into a different folder is refused by the
            # one-installation check and writes nothing.
            $other = Join-Path $env:RUNNER_TEMP 'second newsroom'
            $refused = Invoke-Setup $other 'refused-second-install.log'
            if ($refused -eq 0) { throw 'Setup.exe accepted a second installation into a different folder.' }
            $refusalLog = Get-Content -LiteralPath (Join-Path $evidence 'refused-second-install.log') -Raw
            if ($refusalLog -notmatch 'PrepareToInstall failed') { throw 'The second installation did not stop at the one-installation check.' }
            if (Test-Path -LiteralPath (Join-Path $other 'app')) { throw 'The refused Setup.exe still wrote its payload into the second folder.' }

            # Re-running into the recorded folder upgrades in place and keeps the data.
            if ((Invoke-Setup $env:INSTALL_ROOT 'upgrade-in-place.log') -ne 0) { throw 'Setup.exe could not upgrade the existing folder in place.' }
            $after = Get-ArticleCount
            if ($after -ne $before) { throw "The upgrade changed the article count from $before to $after." }
            if ((Get-Content -LiteralPath "$dataRoot\config.json" -Raw | ConvertFrom-Json).InstanceId -cne $instanceId) { throw 'The upgrade replaced the installation identity.' }
            if ((Get-FileHash -LiteralPath "$dataRoot\config.json" -Algorithm SHA256).Hash -cne $configSha) { throw 'The upgrade rewrote the existing configuration.' }
            Wait-Paper '/'
            @{ refusedExitCode=$refused; articlesBefore=$before; articlesAfter=$after; instanceId=$instanceId } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'one-installation.json')
          } finally {
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$appRoot\installer\Stop.ps1" -DataRoot $dataRoot *> (Join-Path $evidence 'one-installation-stop.log')
          }
      - name: Restore outbound networking after acceptance
        if: always()
        shell: pwsh
        run: |
          if ($env:INSTALL_FIREWALL_RULE) { Get-NetFirewallRule -DisplayName $env:INSTALL_FIREWALL_RULE -ErrorAction SilentlyContinue | Remove-NetFirewallRule }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-install-evidence
          path: ${{ runner.temp }}/install-evidence/*
          if-no-files-found: error
