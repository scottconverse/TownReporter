name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # ESLint was red with nine errors and had never run in CI. One of them
      # was `no-control-regex` -- the rule that flags a literal backspace in a
      # regular expression, which is exactly how the reader-privacy check on
      # the Server page came to match nothing and report a clean result
      # unconditionally. The linter would have caught it in thirty seconds.
      - run: npm run lint
      - run: npm test

  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: File, publish, correct
        env:
          BETTER_AUTH_SECRET: ci-lifecycle-secret-not-for-production
          LIFECYCLE_BASE_URL: http://127.0.0.1:8080
        run: |
          npm run dev > /tmp/townreporter-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/; then
              break
            fi
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ || {
            echo "dev server did not come up"
            tail -n 80 /tmp/townreporter-dev.log || true
            exit 1
          }
          node scripts/lifecycle-e2e.mjs


  # The gap that let two Blockers past a green pipeline.
  #
  # CI ran typecheck, the unit suite, and a lifecycle test against `npm run
  # dev`. It never ran `npm run build`, never booted `.output`, and never
  # opened a page in a browser. A 200 is not proof a page works: the server can
  # answer perfectly while the client bundle throws and the reader sees a
  # spinner forever. That is exactly how `node:crypto` reached the client and
  # left the documented onboarding path dead.
  #
  # Both modes run, because they fail differently. The dev-mode job is the one
  # that catches externalization; a production build silently tolerated the
  # same defect when I tested it deliberately.

  smoke-built:
    name: Built server boots and serves
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Boot the built server and smoke it
        env:
          BETTER_AUTH_SECRET: ci-smoke-secret-not-for-production
          PORT: "3000"
          HOST: 127.0.0.1
          SMOKE_BASE_URL: http://127.0.0.1:3000
          # No provider, on purpose: the first-run state a new operator meets.
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: |
          npm start > /tmp/built.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3000/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3000/ || {
            echo "built server did not come up"; tail -n 80 /tmp/built.log; exit 1;
          }
          node scripts/smoke-built-server.mjs
      # A gate audit found no protective headers on any route, which made the
      # Server page's restart controls clickjackable: a framed page's click is
      # a genuine same-origin request, so the session guard is satisfied. Only
      # the browser can refuse the frame. This asks a real browser.
      - name: The desk refuses to be framed
        env:
          SECURITY_HEADERS_BASE_URL: http://127.0.0.1:3000
        run: node scripts/security-headers-e2e.mjs

  smoke-dev:
    name: Documented dev path works in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the README's own quick start, then open it
        env:
          BETTER_AUTH_SECRET: ci-smoke-secret-not-for-production
          SMOKE_BASE_URL: http://127.0.0.1:8080
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: |
          cp .env.example .env
          npm run dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ || {
            echo "dev server did not come up"; tail -n 80 /tmp/dev.log; exit 1;
          }
          node scripts/smoke-built-server.mjs

  # The unit suite runs against PGLite, which has no pg_trgm and no admin
  # connection to create a scratch database from, so three files that need a
  # REAL Postgres skip there and announce why (see
  # src/lib/test-support/pg-admin.ts). Skipping is honest but it is not
  # coverage: without this job those three properties -- the archive search is
  # an indexed lookup, sign-in is actually rate-limited, and giving up the
  # desk refuses a mismatched confirmation -- are only ever asserted on a
  # developer's machine.
  #
  # This gives them a real Postgres. `TEST_POSTGRES_ADMIN_URL` is how they find
  # it: the tests used to hardcode a developer's own `127.0.0.1:5433`, which is
  # exactly the port/user/password this service does NOT use, so they could
  # never have passed here. scripts/postgres-tests-are-covered.test.mjs fails
  # the build if a file capable of this skip is ever removed from this list
  # without a replacement.
  #
  # Also runs the real migrations against `townreporter_ci` and re-runs the
  # 20,000-story search benchmark from scratch, failing if the index does not
  # help -- a property no single test file above measures.
  postgres-integration:
    name: The three Postgres-only properties, on a real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: townreporter_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/townreporter_ci
      TEST_POSTGRES_ADMIN_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
      BETTER_AUTH_SECRET: ci-search-secret-not-for-production
      TOWNREPORTER_CLAUDE_CODE: "0"
      # Stream each spawned server's own stdout/stderr into the job log. A
      # loader failure degrades to an empty page and the console.error naming
      # the cause otherwise goes to stdio:"ignore" -- the search failure here
      # was undiagnosable without it.
      PG_TEST_SERVER_LOGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/migrate.mjs
      - name: Sign-in throttling, giving up the desk, the search index, the reader-facing leak guard, a dead run recovering, and the configured paper identity -- each against its own scratch database
        run: node --experimental-strip-types --test src/lib/auth/sign-in-throttle.test.ts src/lib/news/leave-desk.test.ts src/lib/news/search-index.test.ts src/lib/news/public-surfaces.no-leak.test.ts src/lib/news/stalled-run.e2e.test.ts src/lib/news/two-editors.e2e.test.ts src/lib/news/uncredited-source-warning.e2e.test.ts src/lib/news/paper-identity.e2e.test.ts
      - name: The index actually makes the search cheaper
        run: node scripts/search-index-proof.mjs
      - name: ensureDarkSchema survives a database rebuilt underneath the running process (ENG-104)
        run: node --experimental-strip-types --test src/lib/news/dark-schema-rebuild.test.ts

  # These two walks each need an UNCLAIMED desk: they create their own owner
  # at /login, and the first account in owns the newsroom.
  #
  # The desk-flows walk used to be a STEP inside the lifecycle job, running
  # after lifecycle-e2e had already claimed that server's desk. It could never
  # pass -- it failed at step zero with an empty completed list, on a server
  # where the sign-up form no longer exists. An audit filed it as a blocker,
  # and it was right: a job that cannot go green is not coverage, it is a
  # red light nobody reads.
  #
  # Separate jobs, each with its own server. With no DATABASE_URL the app
  # falls back to in-memory PGLite, so every job starts on an empty database
  # and owns its own desk.
  desk-flows:
    name: The 0.5.1 desk flows, in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Opinion, delete, Undo, trash, Server, dials
        env:
          BETTER_AUTH_SECRET: ci-flows-secret-not-for-production
          DESK_FLOWS_BASE_URL: http://127.0.0.1:8080
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: |
          npm run dev > /tmp/flows.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ || {
            echo "dev server did not come up"; tail -n 80 /tmp/flows.log; exit 1;
          }
          node scripts/desk-flows-e2e.mjs

  # The Writing models panel: the screen an operator reaches on the worst day,
  # when a writing-model login has lapsed and every draft is failing. All of it
  # is screen behaviour -- the right words in the row, a link rendered as a real
  # anchor, a row that flips to "Signed in" on its own -- so a unit test proves
  # none of it.
  #
  # Two phases with two servers, because what changes between them is the
  # server's own environment and a running server cannot be told to change its
  # mind. Each phase starts on an empty PGLite database and claims its own desk.
  # The CLI it drives is scripts/fakes/fake-claude-cli.mjs: nothing here spends,
  # and nothing here touches a real credential.
  provider-signin:
    name: Signing in to a writing model, in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: With no CLI on the machine, the panel says so
        env:
          BETTER_AUTH_SECRET: ci-signin-secret-not-for-production
          PORT: "3312"
          HOST: 127.0.0.1
          PROVIDER_SIGNIN_BASE_URL: http://127.0.0.1:3312
          PROVIDER_SIGNIN_PHASE: missing
        run: |
          npm run dev -- --port 3312 > /tmp/signin-missing.log 2>&1 &
          DEV_PID=$!
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3312/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3312/ || {
            echo "dev server did not come up"; tail -n 80 /tmp/signin-missing.log; exit 1;
          }
          node scripts/provider-signin-e2e.mjs
          # By PID, never by name: this ends the server this step started and
          # nothing else that happens to be a node process on the runner.
          #
          # `npm run dev` is `npm run db:migrate && node scripts/with-app-env.mjs
          # vite dev`, so $! is only the top of a process tree -- npm's own
          # child shell, with-app-env.mjs, and the vite dev server it spawns are
          # all descendants with their own PIDs. `kill "$DEV_PID"` alone left
          # that vite process running, still bound to :3312 and still holding
          # phase one's in-memory PGlite desk -- so phase two's fresh server
          # never started, its e2e script (or a truly fresh one) landed on the
          # OLD server, and "Create the desk" showed "This desk already has an
          # editor" instead of the sign-up form. Walk the whole tree by PID.
          kill_tree() {
            local pid="$1"
            local child
            for child in $(pgrep -P "$pid" 2>/dev/null || true); do
              kill_tree "$child"
            done
            kill "$pid" 2>/dev/null || true
          }
          kill_tree "$DEV_PID"
          for i in $(seq 1 15); do
            curl -sf -o /dev/null --max-time 1 http://127.0.0.1:3312/ || break
            sleep 1
          done
          curl -sf -o /dev/null --max-time 1 http://127.0.0.1:3312/ && {
            echo "phase one's server is still answering on :3312 after kill_tree -- phase two would reuse its already-claimed desk"; exit 1;
          }
          true
      - name: With a CLI installed and signed out, Sign in shows the link and completes
        env:
          BETTER_AUTH_SECRET: ci-signin-secret-not-for-production
          PORT: "3312"
          HOST: 127.0.0.1
          PROVIDER_SIGNIN_BASE_URL: http://127.0.0.1:3312
          PROVIDER_SIGNIN_PHASE: fake
          CLAUDE_CLI_PATH: scripts/fakes/fake-claude-cli.mjs
          FAKE_CLAUDE_STATE_FILE: /tmp/fake-claude-signed-in
          FAKE_CLAUDE_DELAY_MS: "8000"
        run: |
          rm -f /tmp/fake-claude-signed-in
          npm run dev -- --port 3312 > /tmp/signin-fake.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3312/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3312/ || {
            echo "dev server did not come up"; tail -n 80 /tmp/signin-fake.log; exit 1;
          }
          node scripts/provider-signin-e2e.mjs

  # Delete, trash, and the public corrections feed each had a fix proven only
  # by a unit test: a deleted story's correction could outlive it and print
  # under a null headline, restoring a story from the trash could leave its
  # correction behind, the public corrections feed could print a correction
  # for a story that was never published, and a transcript locator meant for
  # the desk, not a reader, could reach the article page through either of two
  # copies of the function that was supposed to strip it. None of that had
  # ever been driven through a browser.
  delete-corrections:
    name: Delete, trash, and the public corrections feed, in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: townreporter_delete_corr
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/townreporter_delete_corr
      BETTER_AUTH_SECRET: ci-delete-corr-secret-not-for-production
      PORT: "8080"
      HOST: 127.0.0.1
      DELETE_CORR_BASE_URL: http://127.0.0.1:8080
      TOWNREPORTER_CLAUDE_CODE: "0"
      # Both scripts in this job share one desk: delete-corrections creates
      # this account, opinion-desk signs in with it.
      E2E_DESK_EMAIL: e2e-delete-corr@townreporter.test
      E2E_DESK_PASSWORD: e2e-delete-corr-shared-pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/migrate.mjs
      - name: File, publish, correct, delete, restore, and check the locator never prints
        run: |
          npm run build
          npm start > /tmp/delete-corr.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ || {
            echo "built server did not come up"; tail -n 80 /tmp/delete-corr.log; exit 1;
          }
          node scripts/delete-corrections-e2e.mjs

      # Two the operator hit on the live desk. Read it opened the piece two
      # pixels below the fold, so it looked dead while working perfectly. And
      # a run that finished without producing anything could never be removed,
      # because Delete was keyed on a draft that did not exist -- one of those
      # rows reported neither a piece nor an error, so it looked like work in
      # progress that had actually stopped.
      #
      # It lives in THIS job because it seeds those rows straight into
      # Postgres, so the server has to be reading the same database. The
      # jobs that run against PGLite would have it writing somewhere the app
      # never looks, and passing while proving nothing.
      - name: The Opinion desk can be read and tidied
        env:
          BETTER_AUTH_SECRET: ci-delete-corr-secret-not-for-production
          OPINION_BASE_URL: http://127.0.0.1:8080
          OPINION_DB_URL: postgres://postgres:ci@127.0.0.1:5432/townreporter_delete_corr
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: node scripts/opinion-desk-e2e.mjs

  # The front page promises "Sources shown." A lead carrying a source URL
  # published a story with no sources section at all: the lead stored the URL,
  # the draft it created did not, and publishing reads the draft. The data was
  # dropped between two tables, which no unit test on either table would see.
  sources-reach-the-reader:
    name: A source on a lead reaches the reader
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Both scripts in this job share one desk: the first creates this
      # account, the second signs in with it (the desk has one editor, so a
      # second create would wait forever on a Name field that is not there).
      E2E_DESK_EMAIL: e2e-sources@townreporter.test
      E2E_DESK_PASSWORD: e2e-sources-shared-pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: File a lead with a source, publish, read it as a reader
        env:
          BETTER_AUTH_SECRET: ci-sources-secret-not-for-production
          SOURCES_BASE_URL: http://127.0.0.1:8080
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: |
          npm run dev > /tmp/sources.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ || {
            echo "dev server did not come up"; tail -n 80 /tmp/sources.log; exit 1;
          }
          node scripts/sources-reach-the-reader.mjs

      # A piece written outside the desk has to reach the desk and stop there.
      # This walk's first run caught filing reporting success while the editor
      # saw nothing on screen, and it fails if a pasted piece ever reaches the
      # public paper or the feed without a person publishing it.
      - name: File a piece written outside the desk
        env:
          BETTER_AUTH_SECRET: ci-sources-secret-not-for-production
          PASTE_BASE_URL: http://127.0.0.1:8080
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: node scripts/paste-editorial-e2e.mjs

  # TEST-003: ops/watchdog.ps1 kept the paper alive for weeks with nothing
  # proving it actually WORKS -- only scripts/ops-scripts.test.mjs, which
  # checks that it parses and avoids three known mistakes, never that a dead
  # app comes back. "The recovery story tested by machine instead of by
  # outage," in the operator's own words.
  #
  # This runs the real thing on a real Windows runner: build the app, boot it,
  # confirm it answers, kill it by the PID this job captured (never by image
  # name -- see ops/watchdog.ps1's own rule), run the watchdog, and fail the
  # build if the app is not back. It never touches this project's real ports
  # or scheduled tasks: WATCHDOG_APP_PORT/WATCHDOG_PG_PORT/WATCHDOG_START_SCRIPT
  # point the watchdog at a disposable app and a faked-up Postgres listener
  # instead, and PUBLIC_SITE_URL points its public-reachability check at the
  # same disposable app rather than the live townreporter.org. Unset, every
  # one of those defaults back to exactly what the live paper already used --
  # that equivalence is itself asserted statically in ops-scripts.test.mjs.
  windows-watchdog-recovery:
    name: The watchdog actually brings a dead app back (TEST-003)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: ci-watchdog-secret-not-for-production
      TOWNREPORTER_CLAUDE_CODE: "0"
      # Neither port is this project's real one (3000 app / 5433 postgres):
      # spare ports on a disposable CI runner, chosen only to avoid colliding
      # with each other or common runner services.
      WATCHDOG_APP_PORT: "3050"
      WATCHDOG_PG_PORT: "5199"
      WATCHDOG_START_SCRIPT: "scripts/ci-watchdog-start.ps1"
      PUBLIC_SITE_URL: "http://127.0.0.1:3050/"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # One step, on purpose. The runner tears down a step's child processes
      # when the step ends, so an app booted in one step is gone by the next.
      - name: Kill the app and prove the watchdog brings it back
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $port = $env:WATCHDOG_APP_PORT

          # The watchdog refuses to touch the app while it believes Postgres is
          # down (on purpose -- see ops/watchdog.ps1). This runner has no real
          # Postgres, so a bare TCP listener stands in: the watchdog only does a
          # port-listen check before deciding it is safe to restart the app.
          $pg = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, [int]$env:WATCHDOG_PG_PORT)
          $pg.Start()

          function Wait-Up($seconds) {
            for ($i = 0; $i -lt $seconds; $i++) {
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { return $true }
              } catch {}
              Start-Sleep -Seconds 1
            }
            return $false
          }

          try {
            $env:PORT = $port
            $env:HOST = "127.0.0.1"
            $node = (Get-Command node).Source
            Start-Process -FilePath $node -ArgumentList ".output/server/index.mjs" `
              -RedirectStandardOutput app.out.log -RedirectStandardError app.err.log -NoNewWindow
            if (-not (Wait-Up 90)) {
              Get-Content app.out.log,app.err.log -ErrorAction SilentlyContinue
              throw "built server did not come up on $port"
            }

            # Kill whoever holds the port, not a remembered PID -- the same way
            # the watchdog identifies the app it is repairing.
            $owners = @(Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty OwningProcess -Unique)
            if ($owners.Count -eq 0) { throw "nothing was listening on $port -- the app died on its own and the test would prove nothing" }
            foreach ($owner in $owners) { Stop-Process -Id $owner -Force }
            Start-Sleep -Seconds 2
            if (Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue) {
              throw "app port $port is still listening after the kill -- the test would prove nothing"
            }

            pwsh -NoProfile -File ops/watchdog.ps1
            $back = Wait-Up 90
            Get-Content logs/watchdog.log -ErrorAction SilentlyContinue
            if (-not $back) { throw "watchdog did not bring the app back on $port" }
          } finally {
            $pg.Stop()
            $owners = @(Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty OwningProcess -Unique)
            foreach ($owner in $owners) { Stop-Process -Id $owner -Force -ErrorAction SilentlyContinue }
          }
