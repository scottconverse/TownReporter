  # TEST-003: ops/watchdog.ps1 kept the paper alive for weeks with nothing
  # proving it actually WORKS -- only scripts/ops-scripts.test.mjs, which
  # checks that it parses and avoids three known mistakes, never that a dead
  # app comes back. "The recovery story tested by machine instead of by
  # outage," in the operator's own words.
  #
  # This runs the real thing on a real Windows runner: build the app, boot it,
  # confirm it answers, kill it by the PID this job captured (never by image
  # name -- see ops/watchdog.ps1's own rule), run the watchdog, and fail the
  # build if the app is not back. It never touches this project's real ports
  # or scheduled tasks: WATCHDOG_APP_PORT/WATCHDOG_PG_PORT/WATCHDOG_START_SCRIPT
  # point the watchdog at a disposable app and a faked-up Postgres listener
  # instead, and PUBLIC_SITE_URL points its public-reachability check at the
  # same disposable app rather than the live townreporter.org. Unset, every
  # one of those defaults back to exactly what the live paper already used --
  # that equivalence is itself asserted statically in ops-scripts.test.mjs.
  windows-watchdog-recovery:
    name: The watchdog actually brings a dead app back (TEST-003)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: ci-watchdog-secret-not-for-production
      TOWNREPORTER_CLAUDE_CODE: "0"
      # Neither port is this project's real one (3000 app / 5433 postgres):
      # spare ports on a disposable CI runner, chosen only to avoid colliding
      # with each other or common runner services.
      WATCHDOG_APP_PORT: "3050"
      WATCHDOG_TEST_MODE: "1"
      WATCHDOG_PG_PORT: "5199"
      WATCHDOG_START_SCRIPT: "scripts/ci-watchdog-start.ps1"
      PUBLIC_SITE_URL: "http://127.0.0.1:3050/"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # One step, on purpose. The runner tears down a step's child processes
      # when the step ends, so an app booted in one step is gone by the next.
      - name: Kill the app and prove the watchdog brings it back
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $port = $env:WATCHDOG_APP_PORT

          # The watchdog refuses to touch the app while it believes Postgres is
          # down (on purpose -- see ops/watchdog.ps1). This runner has no real
          # Postgres, so a bare TCP listener stands in: the watchdog only does a
          # port-listen check before deciding it is safe to restart the app.
          $pg = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, [int]$env:WATCHDOG_PG_PORT)
          $pg.Start()

          function Wait-Up($seconds) {
            for ($i = 0; $i -lt $seconds; $i++) {
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { return $true }
              } catch {}
              Start-Sleep -Seconds 1
            }
            return $false
          }

          try {
            $env:PORT = $port
            $env:HOST = "127.0.0.1"
            $node = (Get-Command node).Source
            Start-Process -FilePath $node -ArgumentList ".output/server/index.mjs" `
              -RedirectStandardOutput app.out.log -RedirectStandardError app.err.log -NoNewWindow
            if (-not (Wait-Up 90)) {
              Get-Content app.out.log,app.err.log -ErrorAction SilentlyContinue
              throw "built server did not come up on $port"
            }

            # Kill whoever holds the port, not a remembered PID -- the same way
            # the watchdog identifies the app it is repairing.
            $owners = @(Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty OwningProcess -Unique)
            if ($owners.Count -eq 0) { throw "nothing was listening on $port -- the app died on its own and the test would prove nothing" }
            foreach ($owner in $owners) { Stop-Process -Id $owner -Force }
            Start-Sleep -Seconds 2
            if (Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue) {
              throw "app port $port is still listening after the kill -- the test would prove nothing"
            }

            pwsh -NoProfile -File ops/watchdog.ps1
            $back = Wait-Up 90
            Get-Content logs/watchdog.log -ErrorAction SilentlyContinue
            if (-not $back) { throw "watchdog did not bring the app back on $port" }
          } finally {
            $pg.Stop()
            $owners = @(Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty OwningProcess -Unique)
            foreach ($owner in $owners) { Stop-Process -Id $owner -Force -ErrorAction SilentlyContinue }
          }


