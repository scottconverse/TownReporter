  # Delete, trash, and the public corrections feed each had a fix proven only
  # by a unit test: a deleted story's correction could outlive it and print
  # under a null headline, restoring a story from the trash could leave its
  # correction behind, the public corrections feed could print a correction
  # for a story that was never published, and a transcript locator meant for
  # the desk, not a reader, could reach the article page through either of two
  # copies of the function that was supposed to strip it. None of that had
  # ever been driven through a browser.
  delete-corrections:
    name: Delete, trash, and the public corrections feed, in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: townreporter_delete_corr
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/townreporter_delete_corr
      BETTER_AUTH_SECRET: ci-delete-corr-secret-not-for-production
      PORT: "8080"
      HOST: 127.0.0.1
      DELETE_CORR_BASE_URL: http://127.0.0.1:8080
      TOWNREPORTER_CLAUDE_CODE: "0"
      # Both scripts in this job share one desk: delete-corrections creates
      # this account, opinion-desk signs in with it.
      E2E_DESK_EMAIL: e2e-delete-corr@townreporter.test
      E2E_DESK_PASSWORD: e2e-delete-corr-shared-pass
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
