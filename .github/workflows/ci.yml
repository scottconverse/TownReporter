  # AE: no white flash in dark mode (0.6.64). The owner, 2026-09-25: "when I
  # change screens and I'm in dark mode ... the screen flashes BRIGHT WHITE,
  # announces where it's going like 'opening desk' then switches back to dark
  # mode". Every appearance preference used to be read in a mount effect, one
  # paint late, so a dark-mode editor got a full light frame on a hard reload
  # and on every navigation into a screen outside the desk shell.
  #
  # This is the regression test for it, and it is a MEASUREMENT: a probe
  # installed before any page script samples, at every animation frame, the
  # color that frame is about to paint, on a hard reload of every desk screen
  # and on a client-side click between them, in dark and in light. Every
  # sampled frame must be the right one; the light pass is the sensitivity
  # control for the dark one, and each pass ends by deliberately breaking the
  # attribute and requiring the same probe to report the other color. Removing
  # the <head> script in src/routes/__root.tsx makes this job fail on the first
  # hard reload with `at: null, #f6f1e7` -- the owner's flash, reproduced.
  #
  # Port 3474, which no other integration file may bind. Boots its own copy of
  # the built server on in-memory PGlite, so there is no `npm start` step here.
  desk-dark-flash:
    name: No light frame in dark mode, in a browser
    runs-on: ubuntu-latest
    # 35, not 20, since Unit U5 added the whole-desk sweep below: two self-
    # booting walks plus a production build do not fit in twenty minutes with
    # any room to spare, and a job whose timeout is the thing that fails is a
    # red light nobody reads. The job's NAME is untouched -- a branch rule
    # matches the name, and `desk-dark-flash` still means what it always did.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Set dark, walk every desk screen, and sample the first frame of each
        env:
          BETTER_AUTH_SECRET: ci-desk-dark-flash-secret-not-for-production
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: node scripts/desk-dark-flash-walk.mjs
      # Unit DB part 3: every route, every link, every button, every form, the
      # job states, and the reader's privacy -- the broadest walk in the
      # repository, and it ran nowhere. It visits every route collected from
      # `src/routes` and fails on a 404, a 500 or a screen showing the wrong
      # page; clicks every distinct internal link and checks the address it
      # lands on; presses every button and records what each one did; drives
      # one job stalled, one failed on quota and one cancelled through the fake
      # provider; and reads back the readers table after a reader visit. No real
      # model: rung 1 points at scripts/fakes/fake-deepseek-endpoint.mjs, started
      # as a child on its own port and stopped by the PID it recorded; local
      # discovery is off, ANTHROPIC_API_KEY is cleared and both CLI rungs point
      # at files that do not exist.
      #
      # It shares this job because both are whole-desk sweeps and both boot the
      # built server in their own process on their own ports (3593 and 3594 for
      # this one), so neither can see the other's desk.
      #
      # WEC_SHOT_MATRIX=lean is the walk's own knob, and the reason is TIME.
      # Measured on the author's machine: the full 5-width x 2-theme x 2-size
      # evidence matrix takes ~11m47s, and lean takes ~6m04s -- the matrix is
      # two thirds of the run and it is the EVIDENCE pass, for the eye. Lean
      # still checks every screen for console errors, and every assertion above
      # runs in both modes; what it drops is 20 screenshots per screen down to
      # 1. The full matrix stays the by-hand evidence run (the walk's header
      # documents both, and WEC_OUT_DIR names where they land).
      #
      # WEC_OUT_DIR must be INSIDE the checkout: the walk puts it through
      # `checkedOutputPath` with the repository as the permitted root. It is
      # uploaded rather than left, because that is the evidence.
      - name: Every route, every link, every button and every wire
        env:
          BETTER_AUTH_SECRET: ci-walk-every-control-secret-not-for-production
          WEC_SHOT_MATRIX: lean
          WEC_OUT_DIR: ${{ github.workspace }}/wec-evidence
        run: node scripts/walk-every-control-0681.mjs
      - name: Preserve the walk-every-control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: walk-every-control-evidence
          path: wec-evidence/
          if-no-files-found: ignore
      # FB6: feedback on every action. The owner, 2026-09-30: "I need much
      # better feedback on all actions everywhere ... a line going back and
      # forth is just lazy." Eight presses on Today, the Queue and Drafts,
      # photographed in the state the fix is about -- the PENDING frame, the
      # OPTIMISTIC frame, the ROLLED-BACK frame -- because none of those is a
      # string a render test can see: a pending state is a frame, and the
      # rollback is a row that came back under a red bar.
      #
      # The failure in step 3 is produced by ABORTING the request at the
      # browser. Every desk server function answers `{ok:true}` on that path --
      # there is no input that makes `setLeadStatus` refuse -- and a walk may
      # not edit the server to invent one.
      #
      # Step 6 carries its own sensitivity control: it puts the old 232px menu
      # and the wrapping `.btn` back on the one element and requires the label
      # to wrap again, so a green run is not a measurement that cannot see the
      # bug it claims is absent.
      #
      # It shares this job because it is a self-booting walk like the two
      # above: it starts the built server in its own process on its own port
      # (8146) over its own in-memory PGlite, so it cannot see their desks and
      # they cannot see its.
      #
      # FB6_SHOTS_DIR must be INSIDE the checkout: the walk puts it through
      # `checkedOutputPath` with the repository as a permitted root. It is
      # uploaded rather than left, because that is the evidence.
      - name: Every press says what it is doing, and says so when it fails
        env:
          BETTER_AUTH_SECRET: ci-fb6-desk-feedback-secret-not-for-production
          TOWNREPORTER_CLAUDE_CODE: "0"
          FB6_SHOTS_DIR: ${{ github.workspace }}/fb6-shots
        run: node scripts/fb6-desk-feedback-walk.mjs
      - name: Preserve the FB6 feedback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fb6-desk-feedback-shots
          path: fb6-shots/
          if-no-files-found: ignore

  # AG: the Control page, walked the way the owner will use it (0.6.65). The
  # terminal menu is replaced by a local page on 127.0.0.1:3095 -- one line
  # saying whether the paper is up, the menu's own six buttons, and a status
  # that refreshes itself. The security of that page has its own node:test file
  # (scripts/control-page-server.test.mjs); this job is about the page as a
  # thing a person reads at night, and every check is a measurement: the font
  # floor and the button heights come from getComputedStyle on every element in
  # the document, the theme toggle has to survive a real reload, Cancel on the
  # stop-all dialog has to run NOTHING, and "Working..." is timed inside the
  # page because the handler runs in the same task as the click.
  #
  # The action the walk presses is FAKE: the server's `runner` seam is injected,
  # so the restart emits two lines and flips a flag in the walk's own process.
  # Nothing is spawned and no scheduled task is touched -- which is the only
  # reason a walk that presses "Restart the Reddit reader" may run in CI. The
  # stub still asserts the argv vector it was handed, so the button labelled
  # with the menu's words is proved to run `redlib.ps1 restart` as an absolute
  # System32 PowerShell with an argument array.
  #
  # Port 3505, which no other integration file may bind. The page's real port is
  # 3095 and is never bound here: a walk on that port would collide with a
  # Control page the owner has open. Nothing is built -- the walk boots
  # ops/control/control-server.mjs in-process -- so there is no `npm run build`
  # step and no `npm start`.
  control-page:
    name: The Control page, in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Open the page, check it reads, toggle the theme, and press one button
        run: node scripts/control-page-walk.mjs

  # AB: one press reads a long scanned packet to the end (0.6.64). An editor
  # attached a 13-page scanned council packet and pressed Redraft. The desk
  # read the twelve pages one vision call may handle (OCR_BATCH_PAGE_LIMIT =
  # 12, src/lib/news/ocr-batches.ts:9), wrote a red "Retry to continue", and
  # never rewrote the draft -- and because that stop THREW, every document
  # attached after the packet was never read at all. This walk attaches the
  # packet and a second document where the UI actually offers it, presses once,
  # watches the stages cross the batch boundary and read the later document in
  # the SAME job, then presses Redraft and requires one more job that reads no
  # page a second time and asks the editor for nothing.
  #
  # Real vision work against a genuinely image-only PDF (unpdf + @napi-rs/canvas,
  # 13 real scanned pages), served by ONE fake endpoint on 8080. That port is not
  # a free choice: inferKind (local-models.ts:103) maps only 1234, 11434 and 8080
  # to a local server kind, and a server of no known kind is never vision-capable
  # -- so a fake anywhere else could serve the writing passes but could never read
  # a page. 1234 and 11434 hold this machine's real LM Studio and Ollama in the
  # authoring worktree; 8080 answers nothing, and the walk refuses loudly if
  # something DOES answer there. CODEX_CLI_PATH and CLAUDE_CLI_PATH point at files
  # that do not exist, so no CLI rung is ready and nothing real is reached.
  #
  # Port 3339, which no other integration file may bind
  # (scripts/integration-ports-are-unique.test.mjs). The walk boots its own copy
  # of the built server on in-memory PGlite, so there is no `npm start` step here.
  redraft-scan:
    name: One press reads a long scanned packet to the end, in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Attach the packet and a second document, read both in one press, then redraft
        env:
          BETTER_AUTH_SECRET: ci-redraft-scan-secret-not-for-production
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: node scripts/redraft-scan-e2e.mjs

  # The three editor controls 0.6.67 exists to ship (Unit AH), walked together
  # in a browser because each one is a press an editor makes and the failures
  # were failures of the press, not of a function.
  #
  # 1. A lead whose STORED machine to-do is 227 characters saves. `notes.ts`
  #    writes to-do lines up to 400 characters and the wire used to refuse
  #    anything over 200, and the desk sends a lead's stored to-do list back
  #    WHOLE on every save and publish -- so one long line the machine itself
  #    wrote made Save edits and Publish both dead on a finished story, with the
  #    raw zod array (`too_big`, `maximum 200`, path `todos,0,t`) shown to the
  #    editor. This walk stores the line lead 240 really carried and presses
  #    Save.
  # 2. An editor's headline survives Redraft (a redraft INSERTs a new row, and
  #    before this the model's headline silently replaced the editor's), the
  #    headline box reads as editable, and "Use the lead's headline" puts the
  #    scan's line back in one press.
  # 3. Publish READS the section it will file under ("Publish in Council") and
  #    one press records that confirmation for the version being printed -- no
  #    separate Confirm button. Then the published headline is edited on
  #    /desk/published, the old words go on the record, and the public page
  #    shows the new headline at the SAME url, so nothing that links to the
  #    story breaks.
  #
  # ONE fake endpoint on 3522 stands in for the model and is the ONLY model the
  # desk can reach: it is the configured gateway (LLM_BASE_URL + LLM_MODEL,
  # which Automatic resolves before its ladder runs) and both CLI rungs point at
  # files that do not exist. Its `ready` headline is asserted on by name, which
  # is what makes "the redraft kept the editor's headline" a fact. Nothing is
  # downloaded or called off the runner, and no credential is used.
  #
  # Port 3521, which no other integration file may bind
  # (scripts/integration-ports-are-unique.test.mjs). The walk boots its own copy
  # of the built server on in-memory PGlite, so there is no `npm start` step here.
  editor-controls-0667:
    name: A long to-do saves, a headline survives a redraft, and Publish confirms its section
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Save a 227-character to-do, keep a headline through a redraft, publish under its section, then re-headline the printed story
        env:
          BETTER_AUTH_SECRET: ci-editor-controls-0667-secret-not-for-production
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: node scripts/editor-controls-0667-walk.mjs

  # TKT-0674: the Reporting tab printed a claim, then a lone "·" on its own line
  # and the raw URL wrapped over four lines -- no site name, no way to pull that
  # claim's source, and nothing proving the reporting notes reached the draft at
  # all. This walk presses both new buttons on a story the product itself built,
  # then reads the STUB'S LOG, per call, to prove the redraft's writer prompt
  # carried the line the editor added. It watches those lines as exact literals
  # (POST /__probe), not as a marker inside the claim text: the desk files the
  # stub's claim and feeds it forward into every later prompt, so a claim-string
  # marker is present in a redraft whether or not the notes ever reached it. The
  # same three probes must be ABSENT from the first draft, before those lines
  # exist, which is the control.
  #
  # The app's own safe-fetch reads https://example.com/ (IANA's static page) for
  # the Pull; that is the walk's one outbound GET. ONE fake endpoint on 3531
  # stands in for the model -- it is the configured gateway (LLM_BASE_URL +
  # LLM_MODEL, which Automatic resolves before its ladder runs) and
  # TOWNREPORTER_CLAUDE_CODE=0 keeps the CLI rungs unreachable -- so no call
  # leaves the runner and no credential is used. Port 3531 belongs to this walk
  # alone (scripts/integration-ports-are-unique.test.mjs).
  claim-sources-pull-0674:
    name: A claim's source reads as its site name, Pull fills the box, Add to notes writes one line, and the redraft carries it
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Read the claim's line, pull its source, add it to the notes, redraft, and read the stub's log
        env:
          BETTER_AUTH_SECRET: ci-claim-sources-0674-secret-not-for-production
          PORT: "8080"
          HOST: 127.0.0.1
          LLM_BASE_URL: http://127.0.0.1:3531/v1
          LLM_MODEL: deepseek-v4.1-flash:cloud
          TOWNREPORTER_CLAUDE_CODE: "0"
          CLAIM_BASE_URL: http://127.0.0.1:8080
        run: |
          npm start > /tmp/claim-sources.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ || {
            echo "built server did not come up"; tail -n 80 /tmp/claim-sources.log; exit 1;
          }
          node scripts/claim-sources-pull-walk.mjs

  # Unit CR (0.6.81), the review's P1 finding. The first account is created
  # BEFORE the setup code is checked, so a wrong code leaves this state: a live
  # session, an unclaimed desk, and the server's refusal on the way back. The
  # signed-in redirect in `Login` fired on the session alone, so it unmounted
  # the error, the setup field and the typed address in the same render that
  # showed them -- and /desk refuses an unclaimed owner, so the browser came
  # straight back to /login, which redirected again. A loop with no screen on
  # which to type the right code, which is the only thing the owner can do.
  #
  # This job is the walk for that recovery: wrong code, refusal READABLE and
  # the form still standing, retype, claim, /desk/setup, desk opens. It needs a
  # virgin desk with a PENDING code, so it runs alone in its own job.
  #
  # No TOWNREPORTER_DATA_ROOT is exported here, and the server is started from
  # the checkout root, so the code the walk reads from
  # `<cwd>/.townreporter-data/logs/SETUP-CODE.txt` is the one this server wrote
  # (the resolution order in scripts/first-run-setup-step.mjs).
  first-owner-setup-code:
    name: A wrong setup code refuses, and the owner can retype it
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Mistype the setup code, then retype it
        env:
          BETTER_AUTH_SECRET: ci-first-owner-setup-code-secret-not-for-production
          PORT: "3541"
          HOST: 127.0.0.1
          DATABASE_URL: ""
          TOWNREPORTER_CLAUDE_CODE: "0"
          FIRST_OWNER_BASE_URL: http://127.0.0.1:3541
        run: |
          npm start > /tmp/first-owner-setup-code.log 2>&1 &
          DEV_PID=$!
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3541/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3541/ || {
            echo "built server did not come up"; tail -n 80 /tmp/first-owner-setup-code.log; exit 1;
          }
          node scripts/first-owner-setup-code-walk.mjs
          kill_tree() {
            local pid="$1"
            local child
            for child in $(pgrep -P "$pid" 2>/dev/null || true); do
              kill_tree "$child"
            done
            kill "$pid" 2>/dev/null || true
          }
          kill_tree "$DEV_PID"

  # BH4 made a removed story answer 410 Gone at its URL. BH6 found that the
  # OTHER door -- the reader already inside the paper, pressing Back to a story
  # that was live when they opened it -- still drew the router's ordinary "not
  # in this edition" panel, and, because a loader that throws leaves the previous
  # match's `loaderData` in place, that panel still carried the removed story's
  # own share card: og:title, og:description, article:*, twitter:* and the tab
  # title. A removal the desk confirmed was, on that path, both the wrong answer
  # and a partial republication of the thing that was removed.
  #
  # This is the guard for that path, and it is the only one that can see the
  # ROUTE'S LOADER run in a real browser. The string-drift test asserts the 410
  # page and the in-app panel print the same two strings; it cannot see which
  # panel a client-side navigation actually renders. The walk boots its own copy
  # of the built server on in-memory PGlite, so there is no `npm start` step
  # here, and it stops it by exiting.
  #
  # `--experimental-strip-types`: the walk imports the desk's own
  # src/lib/news/legal-removal-store.ts so that the story is removed the way the
  # removal dialog removes it, not by deleting a row behind the desk's back.
  #
  # Port 3523, which no other integration file may bind
  # (scripts/integration-ports-are-unique.test.mjs).
  legal-gone-nav:
    name: A legally removed story says so on in-app navigation, in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Press Back to a story the desk removed while it was open
        env:
          BETTER_AUTH_SECRET: ci-legal-gone-nav-secret-not-for-production
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: node --experimental-strip-types scripts/legal-gone-nav-e2e.mjs
      # Unit CT's walk. Every reason Publish is off, each with its own press, on
      # the real desk UI: three rows at the top of the Checks tab, the bottom
      # bar's line, each row's button doing the work it points at, the story
      # publishing, and the red banner's "Review now" reaching the list.
      #
      # It was written for 0.6.81 and never ran, so it had gone stale in three
      # places, all repaired in the same change: the login form gained a
      # first-owner setup code (unit CJ), the desk began shipping DARK by
      # default so its fixed "switch to dark" press found nothing -- and the
      # measurement it labelled "light" was being taken against a dark page --
      # and unit CW deliberately replaced the count CT put on the bottom bar
      # with the first reason said as the press that clears it. That last
      # assertion is now stronger than the count was: the bar's words are
      # compared against the first row's own button, read off the page.
      #
      # Its own process, its own port over in-memory PGlite, its own desk, and
      # no model: LLM_BASE_URL points at a port it proves is dead before it
      # boots, and both CLI rungs point at files that do not exist, so the walk
      # refuses to run if a model is reachable. ~8s.
      - name: Every reason Publish is off, each with its own press
        env:
          BETTER_AUTH_SECRET: ci-publish-blockers-secret-not-for-production
        run: node scripts/publish-blockers-walk.mjs
      # The other 0.6.81 desk walk that nothing ran, and it is here for the same
      # reason: the two belong to one unit and were orphaned together.
      #
      # Unit CP mounted two drawn dialogs -- "Add to this story" and the
      # headline dialog -- that had been built, drawn and exported while NO
      # screen rendered either one. The walk presses both: the first Add is
      # shown to save nothing and to display the story's stored body in its
      # "Now" column, the second saves exactly the text that was shown, and a
      # later "Save edits" is pressed to prove it cannot write the older body
      # back over it. It reaches no model: the add-to mode it picks has no AI
      # branch, it TYPES the headline rather than pressing "Suggest 3 more", and
      # LLM_BASE_URL points at a port it proves is dead before it boots.
      #
      # It needed the same two repairs as the walk above (the login form's
      # first-owner setup code, and a desk that now ships dark, which made its
      # `-light.png` shots dark and its fixed "switch to dark" press find
      # nothing), so both passes now ask for the theme they name. Its own
      # process and port, its own desk; CP_SHOTS_OUT_DIR keeps the screenshots
      # out of the checkout. ~40s.
      - name: The two mounted desk dialogs, in light and dark
        env:
          BETTER_AUTH_SECRET: ci-cp-desk-dialogs-secret-not-for-production
          # Beside the workspace, not in it, and NOT `runner.temp`: the walk
          # puts its screenshot directory through `checkedOutputPath`, whose
          # permitted root is its own parent (`resolve("..")`), the same guard
          # the other self-booting walks use. `runner.temp` is outside it and
          # the walk would refuse to start. This keeps the checkout clean.
          CP_SHOTS_OUT_DIR: ${{ github.workspace }}/../cp-desk-dialogs-evidence
        run: node scripts/cp-desk-dialogs-walk.mjs
      # Unit F6. The auditor opened the dev copy in a real browser and measured
      # the page against the window: `/desk/models` was 135px wider than a
      # 1024px screen, 259px at 900 and 554px at 390, and `/desk/queue` was 64px
      # too wide at 900 -- the whole page scrolled sideways, so the right-hand
      # columns sat off the edge of a phone.
      #
      # This walk measures `documentElement.scrollWidth - clientWidth` (and
      # body's) on every desk route it can reach, at 1280, 1024, 900, 768 and
      # 390px, and asserts 0 for the two pages this unit owns; overflow on any
      # other desk page is printed as a note rather than asserted, because the
      # brief named two pages and a guard that fails on a screen nobody was
      # asked to fix gets switched off instead of read. It also opens the
      # Queue's row menu at 900 and 390, and reads the model select's height at
      # 390 so that "it fits" cannot be satisfied by deleting the control.
      #
      # It runs inside this job rather than a new one: branch protection pins
      # the current job set, the job already installs Chromium and builds the
      # server, and its 20-minute ceiling has room. Its own process, its own
      # port (3591) over in-memory PGlite, its own desk, and no model -- the
      # provider ladder points at a port the walk proves is dead before it
      # boots. ~4 min.
      - name: No desk page scrolls sideways at 1280, 1024, 900, 768 or 390
        env:
          BETTER_AUTH_SECRET: ci-desk-narrow-width-secret-not-for-production
        run: node scripts/desk-narrow-width-walk.mjs
      # Unit UI1b, step 1. Scott, on the live desk: "That DOES NOT look like
      # something you can click... a ton of these text strings with no
      # identifying features that it's an action. These are scattered
      # throughout the interface and they're landmines for humans." The
      # auditor measured 463 controls at 881cbfe8 whose border or fill was
      # under 3:1 against the surface behind them.
      #
      # This walk measures EVERY clickable on EVERY desk route (derived from
      # src/routes/desk*.tsx) in both themes at 1280 and in light at 390, and
      # classifies each one against the design system's rule: a link that goes
      # somewhere is an underlined link in prose; anything that does something
      # needs an edge or fill at 3:1; a target is 44px; a disabled control
      # still shows its edge and its reason. The arithmetic is in
      # scripts/lib/clickable-guard.mjs and is unit-tested.
      #
      # GUARD_BASELINE_ONLY=1 IS TEMPORARY. This unit adds the guard and the
      # measured baseline and converts nothing, so on today's build the walk is
      # RED by design -- the failure count IS the deliverable. The switch makes
      # it print the same report and exit 0 so CI stays green while the
      # conversion is done; THE LAST STEP OF UI1b DELETES THIS ENV LINE and
      # lets the walk fail the build for real. It runs inside this job rather
      # than a new one because branch protection pins the current job set, and
      # the job already installs Chromium and builds the server.
      #
      # Its own process, its own port (3595 -- 3592 is desk-narrow-width's
      # dead-model port and no two integration files may declare the same one),
      # its own desk over in-memory PGlite, and no model: the provider ladder
      # points at a port the walk proves is dead before it boots. ~3 min.
      - name: Nothing clickable is plain text (measured baseline, red by design)
        env:
          BETTER_AUTH_SECRET: ci-desk-clickable-guard-secret-not-for-production
          # TEMPORARY -- removed by UI1b's last step. See the note above.
          GUARD_BASELINE_ONLY: "1"
        run: node scripts/desk-clickable-guard-walk.mjs
