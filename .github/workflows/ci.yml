          PORT: "3493"
          HOST: 127.0.0.1
          NAMED_OUTLETS_BASE_URL: http://127.0.0.1:3493
          DATABASE_URL: ""
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: |
          npm start > /tmp/named-outlets.log 2>&1 &
          DEV_PID=$!
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3493/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3493/ || {
            echo "built server did not come up"; tail -n 80 /tmp/named-outlets.log; exit 1;
          }
          node scripts/named-outlets-e2e.mjs
          kill_tree() {
            local pid="$1"
            local child
            for child in $(pgrep -P "$pid" 2>/dev/null || true); do
              kill_tree "$child"
            done
            kill "$pid" 2>/dev/null || true
          }
          kill_tree "$DEV_PID"

  # X: import finished stories. These four walks boot the built server in their
  # own process (they import .output/server/index.mjs and set their own PORT,
  # HOST and empty DATABASE_URL), so the job builds and then runs the script --
  # no `npm start` step to keep alive, and nothing left listening afterwards.
  import-stories:
    name: Import finished stories, in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Paste a report, review every card, import the ticked ones, publish one
        env:
          BETTER_AUTH_SECRET: ci-import-stories-secret-not-for-production
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: node scripts/import-stories-e2e.mjs

  # X2: paste one story. The Desk's second box, for a single finished story
  # rather than a report -- and the section it opens with comes from the same
  # chooser the write box uses, so a story the chooser cannot place opens
  # "Section not chosen -- pick one" instead of a section nobody chose.
  paste-one-story:
    name: Paste one story, in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Paste one finished story and file it
        env:
          BETTER_AUTH_SECRET: ci-paste-one-story-secret-not-for-production
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: node scripts/paste-one-story-e2e.mjs

  # X3: import any format. The owner's own report as the outside tool wrote it
  # (a Claude-authored civic scanner report), plus the other shapes an editor
  # actually pastes -- plain text with no headings, markdown, a saved page.
  import-any-format:
    name: Import a report in any of the formats an editor pastes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Read the same report in every format the box accepts
        env:
          BETTER_AUTH_SECRET: ci-import-any-format-secret-not-for-production
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: node scripts/import-any-format-e2e.mjs

  # T/T2: the front-page river. The reader-facing front page shows the paper's
  # own stories in the order an editor sees them, with the section fix, and this
  # is the walk that pins the reader's page rather than the desk's.
  front-page-river:
    name: The front-page river, in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: The front page shows the river a reader sees
        env:
          BETTER_AUTH_SECRET: ci-front-page-river-secret-not-for-production
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: node scripts/front-page-river-e2e.mjs

  # X5: import a civic-scanner v2.6 report. The report's own readiness statement
  # decides the card -- Tier 1 ticked, Tier 2 developing with its gaps marked,
  # Tier 3 and the Black Desk unverified ideas that are never a draft -- the
  # claims ledger travels as an editor note and is never published, and a
  # PARTIAL run is bannered with its own "what remains" list. Port 3323, which
  # no other integration file may bind.
  import-civic-scanner-v26:
    name: Import a civic-scanner v2.6 report, in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Read a v2.6 report tier by tier and import only what it stands behind
        env:
          BETTER_AUTH_SECRET: ci-import-civic-scanner-v26-secret-not-for-production
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: node scripts/import-civic-scanner-v26-e2e.mjs

  # AA: the daily scan on Automatic. Before 0.6.64 the scheduled scan had to
  # name one provider -- the picker refused Automatic because a scheduled run
  # stores the model it will use before its job is queued, and "your configured
  # gateway at call time" is not a name a stored record can keep. This walk sets
  # the policy to Automatic through the browser, reloads, drives the scheduler's
  # OWN trigger (GET /api/cron/monitors) with a stubbed rung 1, and reads back
  # that the run record names the model that actually ran. Ports 3336 (server)
  # and 3337 (the stubbed DeepSeek endpoint), which no other integration file
  # may bind.
  daily-scan-automatic:
    name: The daily scan on Automatic, in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Set the daily scan to Automatic, run it, and read the model off the run record
        env:
          BETTER_AUTH_SECRET: ci-daily-scan-automatic-secret-not-for-production
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: node scripts/daily-scan-automatic-e2e.mjs
