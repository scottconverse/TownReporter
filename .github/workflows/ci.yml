name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The complete serial suite now exceeds 20 minutes on hosted runners.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:test
      # ESLint was red with nine errors and had never run in CI. One of them
      # was `no-control-regex` -- the rule that flags a literal backspace in a
      # regular expression, which is exactly how the outside-hosts check on
      # the Server page came to match nothing and report a clean result
      # unconditionally. The linter would have caught it in thirty seconds.
      - run: npm run lint
      - run: npm test

  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: File, publish, correct
        env:
          BETTER_AUTH_SECRET: ci-lifecycle-secret-not-for-production
          PORT: "8080"
          HOST: 127.0.0.1
          LIFECYCLE_BASE_URL: http://127.0.0.1:8080
        run: |
          npm start > /tmp/townreporter-built.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/; then
              break
            fi
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ || {
            echo "built server did not come up"
            tail -n 80 /tmp/townreporter-built.log || true
            exit 1
          }
          node scripts/lifecycle-e2e.mjs


  # The gap that let two Blockers past a green pipeline.
  #
  # CI ran typecheck, the unit suite, and a lifecycle test against `npm run
  # dev`. It never ran `npm run build`, never booted `.output`, and never
  # opened a page in a browser. A 200 is not proof a page works: the server can
  # answer perfectly while the client bundle throws and the reader sees a
  # spinner forever. That is exactly how `node:crypto` reached the client and
  # left the documented onboarding path dead.
  #
  # Both modes run, because they fail differently. The dev-mode job is the one
  # that catches externalization; a production build silently tolerated the
  # same defect when I tested it deliberately.

  smoke-built:
    name: Built server boots and serves
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Boot the built server and smoke it
        env:
          BETTER_AUTH_SECRET: ci-smoke-secret-not-for-production
          PORT: "3000"
          HOST: 127.0.0.1
          SMOKE_BASE_URL: http://127.0.0.1:3000
          # No provider, on purpose: the first-run state a new operator meets.
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: |
          npm start > /tmp/built.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3000/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3000/ || {
            echo "built server did not come up"; tail -n 80 /tmp/built.log; exit 1;
          }
          node scripts/smoke-built-server.mjs
      # A gate audit found no protective headers on any route, which made the
      # Server page's restart controls clickjackable: a framed page's click is
      # a genuine same-origin request, so the session guard is satisfied. Only
      # the browser can refuse the frame. This asks a real browser.
      - name: The desk refuses to be framed
        env:
          SECURITY_HEADERS_BASE_URL: http://127.0.0.1:3000
        run: node scripts/security-headers-e2e.mjs

  smoke-dev:
    name: Documented dev path works in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the README's own quick start, then open it
        env:
          BETTER_AUTH_SECRET: ci-smoke-secret-not-for-production
          SMOKE_BASE_URL: http://127.0.0.1:8080
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: |
          cp .env.example .env
          npm run dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ || {
            echo "dev server did not come up"; tail -n 80 /tmp/dev.log; exit 1;
          }
          node scripts/smoke-built-server.mjs

  # The unit suite runs against PGLite, which has no pg_trgm and no admin
  # connection to create a scratch database from, so three files that need a
  # REAL Postgres skip there and announce why (see
  # src/lib/test-support/pg-admin.ts). Skipping is honest but it is not
  # coverage: without this job those three properties -- the archive search is
  # an indexed lookup, sign-in is actually rate-limited, and giving up the
  # desk refuses a mismatched confirmation -- are only ever asserted on a
  # developer's machine.
  #
  # This gives them a real Postgres. `TEST_POSTGRES_ADMIN_URL` is how they find
  # it: the tests used to hardcode a developer's own `127.0.0.1:5433`, which is
  # exactly the port/user/password this service does NOT use, so they could
  # never have passed here. scripts/postgres-tests-are-covered.test.mjs fails
  # the build if a file capable of this skip is ever removed from this list
  # without a replacement.
  #
  # Also runs the real migrations against `townreporter_ci` and re-runs the
  # 20,000-story search benchmark from scratch, failing if the index does not
  # help -- a property no single test file above measures.
  postgres-integration:
    name: Every discovered PostgreSQL-capable test, on a real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: townreporter_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/townreporter_ci
      TOWNREPORTER_RUN_POSTGRES_INTEGRATION: "1"
      TOWNREPORTER_POSTGRES_INTEGRATION_ADMIN_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
      BETTER_AUTH_SECRET: ci-search-secret-not-for-production
      TOWNREPORTER_CLAUDE_CODE: "0"
      # Stream each spawned server's own stdout/stderr into the job log. A
      # loader failure degrades to an empty page and the console.error naming
      # the cause otherwise goes to stdio:"ignore" -- the search failure here
      # was undiagnosable without it.
      PG_TEST_SERVER_LOGS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/migrate.mjs
      - name: The index actually makes the search cheaper
        run: node scripts/search-index-proof.mjs
      - name: Run every discovered database-capable test with per-file nonzero execution proof
        run: node scripts/run-postgres-integration.mjs

  # These two walks each need an UNCLAIMED desk: they create their own owner
  # at /login, and the first account in owns the newsroom.
  #
  # The desk-flows walk used to be a STEP inside the lifecycle job, running
  # after lifecycle-e2e had already claimed that server's desk. It could never
  # pass -- it failed at step zero with an empty completed list, on a server
  # where the sign-up form no longer exists. An audit filed it as a blocker,
  # and it was right: a job that cannot go green is not coverage, it is a
  # red light nobody reads.
  #
  # Separate jobs, each with its own server. With no DATABASE_URL the app
  # falls back to in-memory PGLite, so every job starts on an empty database
  # and owns its own desk.
  desk-flows:
    name: The 0.5.1 desk flows, in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Opinion, delete, Undo, trash, Server, dials
        env:
          BETTER_AUTH_SECRET: ci-flows-secret-not-for-production
          PORT: "8080"
          HOST: 127.0.0.1
          DESK_FLOWS_BASE_URL: http://127.0.0.1:8080
          TOWNREPORTER_CLAUDE_CODE: "0"
          CODEX_CLI_PATH: "${{ github.workspace }}/scripts/fakes/fake-codex-cli.mjs"
          FAKE_CODEX_SIGNED_IN: "1"
        run: |
          npm start > /tmp/flows.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ || {
            echo "built server did not come up"; tail -n 80 /tmp/flows.log; exit 1;
          }
          node scripts/desk-flows-e2e.mjs

  # Directive item 5: an authenticated desk regression that walks Queue, Scan,
  # Sources, Published, Stats, and Server signed-in. The signed-in walk itself is
  # read-only, but when no state file is supplied the run first performs an
  # INTENTIONALLY MUTATING setup step (creates a throwaway owner + first-run
  # setup) and discloses it in the artifact. No-side-effects is enforced against
  # a DISPOSABLE Postgres via counts AND deterministic row hashes; if the
  # snapshots cannot be collected the run FAILS. Every request method is
  # recorded and any mutating method fails the run.
  desk-production-regression:
    name: The production-desk regression, signed in (disclosed mutating setup)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: townreporter_desk_regression
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/townreporter_desk_regression
      BETTER_AUTH_SECRET: ci-desk-regression-secret-not-for-production
      PORT: "8080"
      HOST: 127.0.0.1
      DESK_PRODREG_BASE_URL: http://127.0.0.1:8080
      DESK_PRODREG_ARTIFACT: desk-production-regression.json
      TOWNREPORTER_CLAUDE_CODE: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Walk six desk surfaces signed-in (disclosed mutating setup)
        run: |
          npm start > /tmp/desk-regression.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ || {
            echo "built server did not come up"; tail -n 80 /tmp/desk-regression.log; exit 1;
          }
          node scripts/desk-production-regression.mjs
      - name: Upload per-surface evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desk-production-regression-evidence
          path: desk-production-regression.json

  # Regression for the production symptom where Run scan did work, but the
  # already-open Scan page never replaced its cached running row with the same
  # row's finished values. This job seeds and finishes one row directly: no
  # source fetch, model request, credential, or provider spending is involved.
  scan-refresh-browser:
    name: An open Scan page observes its running row finish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: townreporter_scan_refresh
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/townreporter_scan_refresh
      SCANFIX_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/townreporter_scan_refresh
      BETTER_AUTH_SECRET: ci-scan-refresh-secret-not-for-production
      PORT: "8080"
      HOST: 127.0.0.1
      SCANFIX_BASE_URL: http://127.0.0.1:8080
      TOWNREPORTER_CLAUDE_CODE: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prove the scan refresh regression test rejects the old merge
        run: node scripts/scan-refresh-old-merge-falsification.mjs
      - run: npm run build
      - name: Keep the open page synchronized with the same scan row
        env:
          SCANFIX_ARTIFACT_DIR: ${{ runner.temp }}/scan-refresh-evidence
        run: |
          npm start > /tmp/scan-refresh.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ || {
            echo "built server did not come up"; tail -n 80 /tmp/scan-refresh.log; exit 1;
          }
          node scripts/scan-refresh-runtime-proof.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-refresh-browser-evidence
          path: ${{ runner.temp }}/scan-refresh-evidence

  # The Writing models panel: the screen an operator reaches on the worst day,
  # when a writing-model login has lapsed and every draft is failing. All of it
  # is screen behaviour -- the right words in the row, a link rendered as a real
  # anchor, a row that flips to "Signed in" on its own -- so a unit test proves
  # none of it.
  #
  # Two phases with two servers, because what changes between them is the
  # server's own environment and a running server cannot be told to change its
  # mind. Each phase starts on an empty PGLite database and claims its own desk.
  # The CLI it drives is scripts/fakes/fake-claude-cli.mjs: nothing here spends,
  # and nothing here touches a real credential.
  provider-signin:
    name: Signing in to a writing model, in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: With no CLI on the machine, the panel says so
        env:
          BETTER_AUTH_SECRET: ci-signin-secret-not-for-production
          PORT: "3312"
          HOST: 127.0.0.1
          PROVIDER_SIGNIN_BASE_URL: http://127.0.0.1:3312
          PROVIDER_SIGNIN_PHASE: missing
        run: |
          npm start > /tmp/signin-missing.log 2>&1 &
          DEV_PID=$!
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3312/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3312/ || {
            echo "built server did not come up"; tail -n 80 /tmp/signin-missing.log; exit 1;
          }
          node scripts/provider-signin-e2e.mjs
          # By PID, never by name: this ends the server this step started and
          # nothing else that happens to be a node process on the runner.
          #
          # `npm start` is `node scripts/with-app-env.mjs node .output/server/
          # index.mjs`, so $! is only the top of a process tree -- npm's own
          # child shell, with-app-env.mjs, and the built server it spawns are
          # all descendants with their own PIDs. `kill "$DEV_PID"` alone left
          # that server process running, still bound to :3312 and still holding
          # phase one's in-memory PGlite desk -- so phase two's fresh server
          # never started, its e2e script (or a truly fresh one) landed on the
          # OLD server, and "Create the desk" showed "This desk already has an
          # editor" instead of the sign-up form. Walk the whole tree by PID.
          kill_tree() {
            local pid="$1"
            local child
            for child in $(pgrep -P "$pid" 2>/dev/null || true); do
              kill_tree "$child"
            done
            kill "$pid" 2>/dev/null || true
          }
          kill_tree "$DEV_PID"
          for i in $(seq 1 15); do
            curl -sf -o /dev/null --max-time 1 http://127.0.0.1:3312/ || break
            sleep 1
          done
          curl -sf -o /dev/null --max-time 1 http://127.0.0.1:3312/ && {
            echo "phase one's server is still answering on :3312 after kill_tree -- phase two would reuse its already-claimed desk"; exit 1;
          }
          true
      - name: With a CLI installed and signed out, Sign in shows the link and completes
        env:
          BETTER_AUTH_SECRET: ci-signin-secret-not-for-production
          PORT: "3312"
          HOST: 127.0.0.1
          PROVIDER_SIGNIN_BASE_URL: http://127.0.0.1:3312
          PROVIDER_SIGNIN_PHASE: fake
          CLAUDE_CLI_PATH: scripts/fakes/fake-claude-cli.mjs
          FAKE_CLAUDE_STATE_FILE: /tmp/fake-claude-signed-in
          FAKE_CLAUDE_DELAY_MS: "8000"
        run: |
          rm -f /tmp/fake-claude-signed-in
          npm start > /tmp/signin-fake.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3312/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3312/ || {
            echo "built server did not come up"; tail -n 80 /tmp/signin-fake.log; exit 1;
          }
          node scripts/provider-signin-e2e.mjs

  # Automatic walks its ladder in rank order -- DeepSeek v4.1 Flash, then Qwen
  # 3.6 35B if it is loaded, then Codex Terra -- and finishes on the first rung
  # that is ready. It shipped with unit tests only -- never driven through the
  # desk. Model-free, same trick as provider-signin: the walk starts
  # fake-deepseek-endpoint.mjs (an OpenAI-compatible rung 1 that can answer its
  # readiness probe and then fail a real call the way the test needs),
  # fake-lmstudio-endpoint.mjs (rung 2's server, on 1234 because that is how
  # local discovery recognises an LM Studio one, listing no rung-2 model), and
  # fake-codex-cli.mjs with FAKE_CODEX_VALID_DRAFT=1 as the last rung. Nothing
  # here spends allowance or touches a real credential. See the walk under
  # scripts/, named for what it proves.
  failover:
    name: Automatic's ladder skips a dead rung and fails over on quota, in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: A dead first rung and a quota failure both land on Codex Terra
        env:
          BETTER_AUTH_SECRET: ci-failover-secret-not-for-production
          PORT: "3317"
          HOST: 127.0.0.1
          FAILOVER_BASE_URL: http://127.0.0.1:3317
          TOWNREPORTER_DEEPSEEK_BASE_URL: http://127.0.0.1:3318/v1
          CODEX_CLI_PATH: scripts/fakes/fake-codex-cli.mjs
          FAKE_CODEX_SIGNED_IN: "1"
          FAKE_CODEX_VALID_DRAFT: "1"
          FAKE_CODEX_DELAY_MS: "1500"
        run: |
          npm start > /tmp/failover.log 2>&1 &
          DEV_PID=$!
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3317/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3317/ || {
            echo "built server did not come up"; tail -n 80 /tmp/failover.log; exit 1;
          }
          node scripts/failover-e2e.mjs
          # By PID, never by name -- see the same comment in the
          # provider-signin job above for why a bare `kill "$DEV_PID"` is not
          # enough (npm/with-app-env.mjs/vite are all separate descendants).
          kill_tree() {
            local pid="$1"
            local child
            for child in $(pgrep -P "$pid" 2>/dev/null || true); do
              kill_tree "$child"
            done
            kill "$pid" 2>/dev/null || true
          }
          kill_tree "$DEV_PID"

  story-quota-failover:
    name: Story upload survives a first-rung quota failover to Codex Terra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: A first-rung quota failure preserves the uploaded document through Codex Terra
        env:
          BETTER_AUTH_SECRET: ci-story-quota-secret-not-for-production
          PORT: "3320"
          HOST: 127.0.0.1
          STORY_QUOTA_FAILOVER_BASE_URL: http://127.0.0.1:3320
          TOWNREPORTER_DEEPSEEK_BASE_URL: http://127.0.0.1:3321/v1
          CODEX_CLI_PATH: scripts/fakes/fake-codex-cli.mjs
          FAKE_CODEX_SIGNED_IN: "1"
          FAKE_CODEX_VALID_DRAFT: "1"
          FAKE_CODEX_DELAY_MS: "1500"
        run: |
          npm start > /tmp/story-quota-failover.log 2>&1 &
