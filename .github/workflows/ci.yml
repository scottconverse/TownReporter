      # A piece written outside the desk has to reach the desk and stop there.
      # This walk's first run caught filing reporting success while the editor
      # saw nothing on screen, and it fails if a pasted piece ever reaches the
      # public paper or the feed without a person publishing it.
      - name: File a piece written outside the desk
        env:
          BETTER_AUTH_SECRET: ci-sources-secret-not-for-production
          PASTE_BASE_URL: http://127.0.0.1:8080
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: node scripts/paste-editorial-e2e.mjs

  # TEST-003: ops/watchdog.ps1 kept the paper alive for weeks with nothing
  # proving it actually WORKS -- only scripts/ops-scripts.test.mjs, which
  # checks that it parses and avoids three known mistakes, never that a dead
  # app comes back. "The recovery story tested by machine instead of by
  # outage," in the operator's own words.
  #
  # This runs the real thing on a real Windows runner: build the app, boot it,
  # confirm it answers, kill it by the PID this job captured (never by image
  # name -- see ops/watchdog.ps1's own rule), run the watchdog, and fail the
  # build if the app is not back. It never touches this project's real ports
  # or scheduled tasks: WATCHDOG_APP_PORT/WATCHDOG_PG_PORT/WATCHDOG_START_SCRIPT
  # point the watchdog at a disposable app and a faked-up Postgres listener
  # instead, and PUBLIC_SITE_URL points its public-reachability check at the
  # same disposable app rather than the live townreporter.org. Unset, every
  # one of those defaults back to exactly what the live paper already used --
  # that equivalence is itself asserted statically in ops-scripts.test.mjs.
  windows-watchdog-recovery:
    name: The watchdog actually brings a dead app back (TEST-003)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: ci-watchdog-secret-not-for-production
      TOWNREPORTER_CLAUDE_CODE: "0"
      # Neither port is this project's real one (3000 app / 5433 postgres):
      # spare ports on a disposable CI runner, chosen only to avoid colliding
      # with each other or common runner services.
      WATCHDOG_APP_PORT: "3050"
      WATCHDOG_TEST_MODE: "1"
      WATCHDOG_PG_PORT: "5199"
      WATCHDOG_START_SCRIPT: "scripts/ci-watchdog-start.ps1"
      PUBLIC_SITE_URL: "http://127.0.0.1:3050/"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # A promotion that dies at npm ci takes the paper down with it -- it has
      # already backed up, stopped the app and fast-forwarded by then -- and
      # that is what happened three times on the live machine. `npm test`
      # discovers scripts\promote-step-runner.test.mjs everywhere but skips the
      # parts that run PowerShell; this runner is where they run for real.
      # It uses fake npm and a fake start in a temp directory and touches no
      # service, no port and no database. The 20-second case is why this job's
      # timeout matters, not this step's.
      - name: Prove a promotion survives its own long steps (PR1)
        run: node --test scripts/promote-step-runner.test.mjs
      - run: npm run build
      # One step, on purpose. The runner tears down a step's child processes
      # when the step ends, so an app booted in one step is gone by the next.
      - name: Kill the app and prove the watchdog brings it back
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $port = $env:WATCHDOG_APP_PORT

          # The watchdog refuses to touch the app while it believes Postgres is
          # down (on purpose -- see ops/watchdog.ps1). This runner has no real
          # Postgres, so a bare TCP listener stands in: the watchdog only does a
          # port-listen check before deciding it is safe to restart the app.
          $pg = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, [int]$env:WATCHDOG_PG_PORT)
          $pg.Start()

          function Wait-Up($seconds) {
            for ($i = 0; $i -lt $seconds; $i++) {
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { return $true }
              } catch {}
              Start-Sleep -Seconds 1
            }
            return $false
          }

          try {
            $env:PORT = $port
            $env:HOST = "127.0.0.1"
            $node = (Get-Command node).Source
            Start-Process -FilePath $node -ArgumentList ".output/server/index.mjs" `
              -RedirectStandardOutput app.out.log -RedirectStandardError app.err.log -NoNewWindow
            if (-not (Wait-Up 90)) {
              Get-Content app.out.log,app.err.log -ErrorAction SilentlyContinue
              throw "built server did not come up on $port"
            }

            # Kill whoever holds the port, not a remembered PID -- the same way
            # the watchdog identifies the app it is repairing.
            $owners = @(Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty OwningProcess -Unique)
            if ($owners.Count -eq 0) { throw "nothing was listening on $port -- the app died on its own and the test would prove nothing" }
            foreach ($owner in $owners) { Stop-Process -Id $owner -Force }
            Start-Sleep -Seconds 2
            if (Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue) {
              throw "app port $port is still listening after the kill -- the test would prove nothing"
            }

            pwsh -NoProfile -File ops/watchdog.ps1
            $back = Wait-Up 90
            Get-Content logs/watchdog.log -ErrorAction SilentlyContinue
            if (-not $back) { throw "watchdog did not bring the app back on $port" }
          } finally {
            $pg.Stop()
            $owners = @(Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty OwningProcess -Unique)
            foreach ($owner in $owners) { Stop-Process -Id $owner -Force -ErrorAction SilentlyContinue }
          }


  # ==========================================================================
  # 0.6.63 walks. Each of these scripts existed and was run by hand before this
  # release; none was gated by CI. A walk nobody runs is a claim, not a check --
  # the same gap scan-desk and sources-desk were added for. Every one of them
  # runs on its own port (scripts/integration-ports-are-unique.test.mjs enforces
  # that), with DATABASE_URL empty so it uses in-memory PGlite and never the
  # shared Postgres, and with no real model: the desk's own deterministic reader
  # does the work these walks prove.
  # ==========================================================================

  # S: adding a source to a section without leaving the page. Both halves are
  # checked separately, including across a reload, because half-landed state is
  # the failure this walk exists for: the row is on the watch list the moment it
  # is added, while the assignment to the section only lands on "Confirm and
  # apply".
  sections-source-add:
    name: A source added inside a section lands on the watch list first
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Add a source from inside a section, then assign it
        env:
          BETTER_AUTH_SECRET: ci-sections-source-add-secret-not-for-production
          PORT: "3492"
          HOST: 127.0.0.1
          SECTIONS_SOURCE_ADD_BASE_URL: http://127.0.0.1:3492
          DATABASE_URL: ""
          TOWNREPORTER_CLAUDE_CODE: "0"
        run: |
          npm start > /tmp/sections-source-add.log 2>&1 &
          DEV_PID=$!
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3492/ && break
            sleep 2
          done
          curl -sf -o /dev/null --max-time 2 http://127.0.0.1:3492/ || {
            echo "built server did not come up"; tail -n 80 /tmp/sections-source-add.log; exit 1;
          }
          node scripts/sections-source-add-e2e.mjs
          # By PID, never by name -- see the same comment in the
          # provider-signin job above for why a bare `kill "$DEV_PID"` is not
          # enough (npm/with-app-env.mjs/vite are all separate descendants).
          kill_tree() {
            local pid="$1"
            local child
            for child in $(pgrep -P "$pid" 2>/dev/null || true); do
              kill_tree "$child"
            done
            kill "$pid" 2>/dev/null || true
          }
          kill_tree "$DEV_PID"

  # W: the owner's named-outlet list on Server. The sharp stake is that the list
