<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>@keyframes trPulse{0%,100%{opacity:1}50%{opacity:.25}}</style>
</helmet>
<sc-if value="{{ isPhone }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-family:'Bricolage Grotesque',sans-serif">
    <div style="display:flex;align-items:center;gap:8px"><span style="font-weight:800;font-size:20px;letter-spacing:-.03em">TownReporter</span><span style="font-size:14px;font-weight:700;background:var(--yel);color:#111;padding:1px 6px">Desk</span></div>
    <div style="display:flex;gap:6px">
      <a href="#" style="display:flex;align-items:center;min-height:44px;padding:0 14px;background:var(--yel);color:#111;font-weight:800;font-size:15px">+ New</a>
      <a href="#" style="display:flex;align-items:center;min-height:44px;padding:0 14px;border:2px solid var(--ink);color:var(--ink);font-weight:700;font-size:15px">Menu</a>
    </div>
  </div>
</sc-if>
<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
  <aside style="display:flex;flex-direction:column;gap:4px;position:sticky;top:0;min-height:900px;box-sizing:border-box;padding:20px 14px;font-family:'Bricolage Grotesque',sans-serif;color:var(--ink)">
    <div style="display:flex;flex-direction:column;gap:2px;padding:4px 10px 18px">
      <span style="font-weight:800;font-size:24px;letter-spacing:-.03em">TownReporter</span>
      <span style="align-self:flex-start;font-size:14px;font-weight:700;background:var(--yel);color:#111;padding:2px 8px">Editor’s desk</span>
    </div>
    <sc-if value="{{ hasJobs }}" hint-placeholder-val="{{ false }}">
      <a href="#" onClick="{{ goToday }}" style="display:flex;flex-direction:column;gap:6px;margin:0 0 10px;padding:10px 12px;border:2px solid var(--yel);color:var(--ink)">
        <span style="display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px">{{ pulse }}Running · {{ jobCount }}</span>
        <sc-for list="{{ jobRows }}" as="j" hint-placeholder-count="2"><span style="display:flex;flex-direction:column;font-size:14px;line-height:1.3"><span style="font-weight:700">{{ j.title }}</span><span style="color:var(--ink2)">{{ j.line }}</span></span></sc-for>
      </a>
    </sc-if>
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="11">
      <a href="#" onClick="{{ n.go }}" style="{{ n.style }}"><span>{{ n.label }}</span><span style="font-size:14px;font-weight:700;color:var(--ink2)">{{ n.count }}</span></a>
    </sc-for>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:18px;border-top:1px solid var(--line)">
      <a href="#" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border:2px solid var(--ink);color:var(--ink);font-weight:700;font-size:15px">View the paper ↗</a>
      <div style="display:flex;gap:6px">
        <a href="#" onClick="{{ flip }}" style="flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:15px">{{ themeLabel }}</a>
        <a href="#" style="flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:15px">Aa Large</a>
      </div>
      <span style="font-size:14px;color:var(--ink2);padding:4px 2px">Press ? for keyboard shortcuts</span>
    </div>
  </aside>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:230,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Today&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;phone&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;jobs&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;},&quot;onNav&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(label: string) =&gt; void&quot;},&quot;onTheme&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  componentDidMount() { this.iv = setInterval(() => this.forceUpdate(), 1000); }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const active = this.props.active ?? "Today";
    const phone = !!this.props.phone;
    const jobs = (this.props.jobs || []).filter(j => j.state === "running");
    const items = [["Today", ""], ["Queue", "9"], ["Drafts", "7"], ["Published", ""], ["Opinion", "1"], ["Follow-ups", "5"], ["Dark Desk", "2"], ["Sources & scan", ""], ["Models", ""], ["Server", ""], ["Stats", ""]];
    const base = { display: "flex", justifyContent: "space-between", alignItems: "center", minHeight: "44px", padding: "0 12px", fontWeight: 700, fontSize: "16px", color: "var(--ink)" };
    const go = label => e => { e.preventDefault(); this.props.onNav && this.props.onNav(label); };
    const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    return {
      isPhone: phone, isDesktop: !phone,
      themeLabel: (this.props.theme ?? "dark") === "dark" ? "Light" : "Dark",
      flip: e => { e.preventDefault(); this.props.onTheme && this.props.onTheme(); },
      hasJobs: jobs.length > 0, jobCount: String(jobs.length), goToday: go("Today"),
      jobRows: jobs.slice(0, 3).map(j => ({ title: j.title, line: fmt(Math.floor((Date.now() - (j.startedAt || Date.now())) / 1000)) + " · " + (j.stages ? j.stages[j.stage] : "") })),
      pulse: React.createElement("span", { style: { width: 10, height: 10, background: "var(--yel)", animation: "trPulse 1.2s ease-in-out infinite" } }),
      nav: items.map(([label, count]) => ({ label, count, go: go(label), style: label === active ? Object.assign({}, base, { background: "var(--bg)", boxShadow: "inset 4px 0 0 var(--sel, var(--yel))" }) : base }))
    };
  }
}
</script>
</body>
</html>
