<!-- @dsCard group="Colors" viewport="700x150" subtitle="Words first; color reinforces" name="States" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-display);color:var(--ink);background:var(--bg)}*{box-sizing:border-box}</style></head><body><div style="display:flex;gap:10px;flex-wrap:wrap;padding:16px">
<span style="font-size:14px;font-weight:800;padding:2px 8px;background:var(--yel);color:#111">NEW</span>
<span style="font-size:14px;font-weight:800;padding:2px 8px;border:1px solid var(--ok);color:var(--ok)">✓ No change</span>
<span style="font-size:14px;font-weight:800;padding:2px 8px;background:var(--ink);color:var(--bg)">Checked · not found</span>
<span style="font-size:14px;font-weight:800;padding:2px 8px;border:2px dashed var(--danger);color:var(--danger)">Could not check</span>
<span style="font-size:14px;font-weight:800;padding:2px 8px;border:2px solid var(--warn);color:var(--warn)">! Needs review</span>
<span style="font-size:14px;font-weight:800;padding:2px 8px;border:1px dashed var(--ink2);color:var(--ink2)">≈ PRINTED</span>
<span style="font-size:14px;font-weight:800;padding:2px 8px;border:1px solid var(--ink2);color:var(--ink2)">Waiting</span></div></body></html>
